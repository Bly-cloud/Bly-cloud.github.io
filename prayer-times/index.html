<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10224a">
<meta name="robots" content="noindex">
<meta name="description" content="مواقيت الصلاة حسب المدينة بطريقة أم القرى وغيرها: اليوم والأسبوع والشهر كاملاً هجرياً وميلادياً، مع المخطط اليومي ومقارنة المدن واتجاه القبلة والشاشة الكبيرة.">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<title>مواقيت الصلاة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap">
<style>
@font-face{font-family:'MajallaLocal';src:local('Sakkal Majalla'),local('SakkalMajalla'),local('Majalla');size-adjust:118%}
/* Layout: navy header band with the city and today's dates, settings drawer, view tabs, then the chosen view */
:root{
  color-scheme:light;
  --bg:#e7eaef; --card:#f8f9fb; --soft:#eef1f6; --ink:#0f1e3d; --muted:#586379; --line:#d1d7e0;
  --band-a:#0e1d40; --band-b:#1c3566; --band-ink:#f4f6fa; --band-muted:#b6c1d8;
  --sel-bg:#10224a; --sel-fg:#f4f6fa; --accent:#1c3566; --accent-t:#dfe5f0;
  --gold:#a8741a; --gold-t:#f6ecd8; --down:#b8382f; --down-t:#f8e4e2;
  --night:#1b2747; --dawn:#5d6f9e; --day:#e9d9a8; --dusk:#c98b5d;
  --focus:#10224a; --shadow:0 1px 2px rgba(16,34,74,.08),0 10px 26px rgba(16,34,74,.08);
  --font:'MajallaLocal','Sakkal Majalla','Noto Naskh Arabic','Amiri',serif;
  --latin:system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0c121e; --card:#151e32; --soft:#0f1729; --ink:#e8ecf4; --muted:#9aa5ba; --line:#25304a;
    --band-a:#101c3a; --band-b:#1a2d57;
    --sel-bg:#dde4f3; --sel-fg:#0c121e; --accent:#a9c0ff; --accent-t:#1d2a48;
    --gold:#e8be6a; --gold-t:#33291a; --down:#ff8a80; --down-t:#3a1d22;
    --night:#0a1022; --dawn:#3a4a78; --day:#8a7a4a; --dusk:#8a5a3a;
    --focus:#a9c0ff; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px rgba(0,0,0,.3); color-scheme:dark;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.7;padding-bottom:calc(56px + env(safe-area-inset-bottom,0px));min-height:100vh}
button,input,select{font-family:inherit;font-size:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.in{max-width:980px;margin-inline:auto}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.t{font-family:var(--latin);direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}

.band{background:linear-gradient(160deg,var(--band-a),var(--band-b));color:var(--band-ink);padding-top:calc(26px + env(safe-area-inset-top,0px));padding-bottom:22px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 16px}
.brand{display:flex;align-items:center;gap:12px;font:700 clamp(26px,5.6vw,38px)/1.35 var(--font);margin:0}
.brand svg{flex:none}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;background:transparent;border:1.5px solid rgba(244,246,250,.4);color:var(--band-ink);border-radius:999px;padding:4px 16px;font:600 16px/1.3 var(--font);min-height:44px}
.chip:hover{background:rgba(244,246,250,.12)}
.chip:focus-visible{outline-color:#f4f6fa}
.where{margin-top:14px;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
.where .city{font:700 24px/1.4 var(--font)}
.where .dates{color:var(--band-muted);font-size:17px}

main{padding-top:20px}
details.set{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);margin-bottom:16px}
details.set summary{cursor:pointer;padding:12px 18px;font:700 19px/1.5 var(--font);list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.set summary::-webkit-details-marker{display:none}
details.set summary::after{content:'';width:10px;height:10px;border-inline-start:2.5px solid var(--muted);border-bottom:2.5px solid var(--muted);transform:rotate(-45deg);transition:transform .2s}
details.set[open] summary::after{transform:rotate(135deg)}
.sbody{padding:0 18px 18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>label,.flbl{font:600 17px/1.4 var(--font);color:var(--muted)}
.sel,.num{border:1.5px solid var(--line);border-radius:14px;background:var(--soft);color:var(--ink);padding:6px 10px;min-height:48px;min-width:0;width:100%;font:600 18px/1.4 var(--font)}
.num{direction:ltr;text-align:center;font-family:var(--latin)}
.sel:focus,.num:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-t)}
.adj{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.adj label{font-size:15px;color:var(--muted)}
.adj .num{min-height:42px;font-size:16px}
.span2{grid-column:1/-1}
.check{display:flex;align-items:center;gap:10px;font-weight:600;min-height:44px}
.check input{width:22px;height:22px;accent-color:var(--sel-bg)}
.btns{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{padding:6px 18px;border-radius:999px;font:700 17px/1.4 var(--font);border:1.5px solid var(--line);background:var(--card);color:var(--ink);min-height:44px}
.btn.pri{background:var(--sel-bg);border-color:var(--sel-bg);color:var(--sel-fg)}
.btn:disabled{opacity:.4;cursor:default}
.small{font-size:15px;color:var(--muted);margin:0}

.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;scrollbar-width:thin}
.tab{flex:none;padding:8px 16px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);font:600 17px/1.4 var(--font);min-height:46px;box-shadow:var(--shadow)}
.tab[aria-selected="true"]{background:var(--sel-bg);color:var(--sel-fg);border-color:var(--sel-bg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;min-width:0;margin-bottom:16px}
.card h2{margin:0;font:700 22px/1.4 var(--font)}
.note{margin:0;font-size:16px;color:var(--gold);background:var(--gold-t);border-radius:12px;padding:6px 12px}
.err{margin:0;font:700 18px/1.7 var(--font);color:var(--down)}

.hero{background:linear-gradient(160deg,var(--band-a),var(--band-b));color:var(--band-ink);border-radius:20px;padding:18px 20px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px 20px;box-shadow:var(--shadow);margin-bottom:16px}
.hero small{display:block;color:var(--band-muted);font-size:17px}
.hero .nm{font:700 30px/1.3 var(--font)}
.hero .cd{font:700 clamp(36px,9vw,56px)/1.1 var(--latin);direction:ltr;font-variant-numeric:tabular-nums}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.daynav .dl{font-weight:700;font-size:19px;text-align:center;flex:1 1 200px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{background:var(--soft);border:1.5px solid var(--line);border-radius:16px;padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.tile .pn{font-weight:700;color:var(--muted)}
.tile .pt{font:700 28px/1.3 var(--latin)}
.ap{font-family:var(--font);font-size:.62em;font-weight:700}
.tile.sun{background:transparent;border-style:dashed}
.tile.cur{background:var(--accent-t);border-color:var(--accent)}
.tile.next{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
.tile.next .pn{color:var(--gold)}
.extra{margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 18px}
.extra div{display:flex;justify-content:space-between;gap:10px;padding:8px 2px;border-top:1px solid var(--line)}
.extra dt{color:var(--muted);font-weight:600}
.extra dd{margin:0;font-weight:700}

.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:17px}
td .sub.short{display:none}
@media (max-width:520px){.card{padding:14px 10px}table{min-width:0;font-size:13px}th,td{padding:5px 2px}th{font-size:11px;white-space:normal;padding:5px 1px}td.d{white-space:normal;width:58px;max-width:58px;padding-inline-start:5px}td .sub{font-size:11px}td .sub.full{display:none}td .sub.short{display:block}}
th,td{padding:7px 10px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--soft);color:var(--muted);font-weight:700;position:sticky;top:0}
td.d,th.d{position:sticky;inset-inline-start:0;background:var(--card);text-align:start;z-index:1}
th.d{background:var(--soft);z-index:2}
td .sub{display:block;font-size:13px;color:var(--muted);line-height:1.2}
tr.fri td{background:var(--soft)}
tr.fri td.d{background:var(--soft)}
tr.today td{background:var(--gold-t)}
tr.today td.d{background:var(--gold-t)}
tr:last-child td{border-bottom:0}
.monh{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.mont{font:700 23px/1.4 var(--font)}
.seg{display:inline-flex;gap:6px;flex-wrap:wrap}
.seg button{border:1.5px solid var(--line);background:var(--soft);color:var(--ink);border-radius:999px;padding:4px 16px;font:600 17px/1.4 var(--font);min-height:44px}
.seg button[aria-pressed="true"]{background:var(--sel-bg);border-color:var(--sel-bg);color:var(--sel-fg)}

.tl{display:grid;grid-template-columns:minmax(0,1fr) 56px;gap:12px;align-items:stretch}
.tlsvg{width:56px;height:620px}
.tll{position:relative;height:620px}
.tll span{position:absolute;inset-inline-end:0;transform:translateY(-50%);white-space:nowrap;font-weight:700;font-size:17px}
.tll span.now{color:var(--gold)}
.ivals{margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0 18px}
.ivals div{display:flex;justify-content:space-between;gap:10px;padding:8px 2px;border-top:1px solid var(--line)}
.ivals dt{color:var(--muted);font-weight:600}
.ivals dd{margin:0;font-weight:700}

.cmpsel{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.qb{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:20px;align-items:center}
.qb svg{width:100%;max-width:260px;height:auto}
.qv{font:700 clamp(36px,8vw,52px)/1.2 var(--latin);direction:ltr;text-align:right;color:var(--accent)}

.big{background:#070c18;color:#f4f6fa;border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:18px;min-height:70vh;justify-content:center}
.big:fullscreen{border-radius:0;padding:4vh 5vw;min-height:100vh}
.bclock{font:700 clamp(56px,16vw,150px)/1 var(--latin);text-align:center;direction:ltr;font-variant-numeric:tabular-nums}
.bdate{text-align:center;color:#b6c1d8;font-size:clamp(18px,3vw,28px)}
.bnext{text-align:center;font-size:clamp(22px,4vw,40px)}
.bnext b{color:#f2c46d}
.bnext .t{display:block;font:700 clamp(40px,10vw,96px)/1.15 var(--latin);color:#f2c46d}
.btiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.btiles div{background:rgba(244,246,250,.07);border:1px solid rgba(244,246,250,.15);border-radius:16px;padding:10px;text-align:center;min-width:0}
.btiles div.next{border-color:#f2c46d;background:rgba(242,196,109,.12)}
.btiles small{display:block;color:#b6c1d8;font-size:clamp(15px,2vw,22px)}
.btiles b{font:700 clamp(18px,3.4vw,40px)/1.2 var(--latin);display:block}
@media (max-width:620px){.btiles{grid-template-columns:repeat(3,minmax(0,1fr))}.qb{grid-template-columns:minmax(0,1fr)}.qb svg{margin-inline:auto}}
.toast{position:fixed;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));margin-inline:auto;width:fit-content;max-width:calc(100% - 32px);background:var(--sel-bg);color:var(--sel-fg);border-radius:999px;padding:8px 22px;font:700 18px/1.5 var(--font);opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.toast.on{opacity:1}
.ptitle{display:none}
@media print{
  :root{color-scheme:light;--card:#fff;--soft:#f1f3f6;--ink:#000;--muted:#333;--line:#bbb;--gold-t:#f4ead2}
  body{background:#fff;padding:0;font-size:12px}
  .band,.tabs,details.set,.noprint,.toast{display:none!important}
  .card{box-shadow:none;border:0;padding:0;margin:0}
  .ptitle{display:block;font:700 18px/1.5 var(--font);margin:0 0 6px}
  .tw{overflow:visible;border:0}
  table{min-width:0;font-size:11px}
  th,td{padding:3px 4px}
  th{position:static}
  td.d,th.d{position:static}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

</main>

}

  var n=new Date(),o={};f.formatToParts(n).forEach(function(p){o[p.type]=p.value;});

function wd(dn){return ((dn+4)%7+7)%7;}
var HF=null,HC=new Map(),H2C=new Map();
try{HF=new Intl.DateTimeFormat('en-u-ca-islamic-umalqura-nu-latn',{timeZone:'UTC',year:'numeric',month:'numeric',day:'numeric'});if(HF.resolvedOptions().calendar!=='islamic-umalqura')HF=null;}catch(e){HF=null;}
function tabular(dn){var jd=dn+2440588,l=jd-1948440+10632,n=Math.floor((l-1)/10631);l=l-10631*n+354;var j=Math.floor((10985-l)/5316)*Math.floor((50*l)/17719)+Math.floor(l/5670)*Math.floor((43*l)/15238);l=l-Math.floor((30-j)/15)*Math.floor((17719*j)/50)-Math.floor(j/16)*Math.floor((15238*j)/43)+29;var m=Math.floor((24*l)/709);return {y:30*n+j-30,m:m,d:l-Math.floor((709*m)/24)};}

/* ---------- astronomy (standard prayer-time algorithm) ---------- */
var R2D=180/Math.PI,D2R=Math.PI/180;

function p2(n){return (n<10?'0':'')+n;}

  var c=cityObj(S.city),dns=[],i,title;
  if(S.monthBase==='g'){var y=V.mon.y,m=V.mon.m,len=new Date(Date.UTC(y,m,0)).getUTCDate(),f=dnOf(y,m,1);for(i=0;i<len;i++)dns.push(f+i);title=GM[m-1]+' '+dz(y)+' م';}
  else{var hy=V.mon.y,hm=V.mon.m,f2=h2dn(hy,hm,1),l2=hLen(hy,hm);if(f2!=null)for(i=0;i<l2;i++)dns.push(f2+i);title=HM[hm-1]+' '+dz(hy)+' هـ';}
  return {c:c,dns:dns,title:title};
}
function anchorMonth(dn){if(S.monthBase==='g'){var g=ymdOf(dn);V.mon={y:g.y,m:g.m};}else{var h=hOf(dn);V.mon={y:h.y,m:h.m};}}
function monthView(){
  var M=monthDays(),c=M.c,g2=M.dns.length?ymdOf(M.dns[0]):null,g3=M.dns.length?ymdOf(M.dns[M.dns.length-1]):null;
  var sub=S.monthBase==='h'&&g2?GM[g2.m-1]+(g2.m!==g3.m?' – '+GM[g3.m-1]:'')+' '+dz(g3.y)+' م':(M.dns.length?(function(){var a=hOf(M.dns[0]),b=hOf(M.dns[M.dns.length-1]);return HM[a.m-1]+(a.m!==b.m?' – '+HM[b.m-1]:'')+' '+dz(b.y)+' هـ';})():'');
  return '<section class="card"><div class="monh noprint"><div><div class="mont">'+M.title+'</div><div class="small">'+sub+'</div></div>'+
    '<div class="seg" role="group" aria-label="نوع الشهر"><button type="button" data-act="mbase" data-v="g" aria-pressed="'+(S.monthBase==='g')+'">ميلادي</button><button type="button" data-act="mbase" data-v="h" aria-pressed="'+(S.monthBase==='h')+'">هجري</button></div></div>'+
    '<div class="btns noprint"><button class="btn" type="button" data-act="mprev">→ الشهر السابق</button><button class="btn" type="button" data-act="mnow">الشهر الحالي</button><button class="btn" type="button" data-act="mnext">الشهر التالي ←</button></div>'+
    '<p class="ptitle">مواقيت الصلاة في '+esc(c.n)+' — '+M.title+' ('+sub+')</p>'+
    tableHTML(c,M.dns)+methodNote(c)+
    '<div class="btns noprint"><button class="btn pri" type="button" data-act="print">طباعة الجدول</button><button class="btn" type="button" data-act="csv">تنزيل الجدول (Excel)</button></div>'+
    '<p class="small noprint">يوم الجمعة مظلل، واليوم الحالي ملون.'+(S.h12?' الأوقات في الجدول بنظام 12 ساعة بلا ص/م لتوفير المساحة.':'')+'</p></section>';
}
function csv(){
  var M=monthDays(),c=M.c,rows=[['اليوم','الهجري','الميلادي','الإمساك'].concat(P.map(function(p){return p[1];}))];
  var keep=S.digits;S.digits='en';var h12=S.h12;
  M.dns.forEach(function(dn){var g=ymdOf(dn),r=times(c,g.y,g.m,g.d),hd=hOf(dn);
    rows.push([WD[wd(dn)],hd.d+' '+HM[hd.m-1]+' '+hd.y,g.y+'-'+p2(g.m)+'-'+p2(g.d),fmtT(r.imsak)].concat(P.map(function(p){return fmtT(r[p[0]]);})));});
  S.digits=keep;S.h12=h12;
  var txt='﻿'+rows.map(function(r){return r.map(function(x){return '"'+String(x).replace(/"/g,'""')+'"';}).join(',');}).join('\r\n');
  try{
    var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'}));
    a.download='prayer-times-'+c.id+'-'+M.title.replace(/\s+/g,'-')+'.csv';document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);toast('تم تنزيل الجدول');
  }catch(e){toast('تعذّر التنزيل في هذا المتصفح');}
}
function timelineView(){
  var c=cityObj(S.city),n=nowIn(c.tz),dn=dnOf(n.y,n.m,n.d),r=times(c,n.y,n.m,n.d),H=620;
  function y(h){return Math.max(0,Math.min(H,h/24*H));}
  var seg=[[0,r.fajr,'var(--night)'],[r.fajr,r.sunrise,'var(--dawn)'],[r.sunrise,r.maghrib,'var(--day)'],[r.maghrib,r.isha,'var(--dusk)'],[r.isha,24,'var(--night)']];
  var svg='<svg class="tlsvg" viewBox="0 0 56 '+H+'" aria-hidden="true">';
  seg.forEach(function(s){svg+='<rect x="16" y="'+y(s[0])+'" width="24" height="'+Math.max(0,y(s[1])-y(s[0]))+'" fill="'+s[2]+'"/>';});
  P.forEach(function(p){svg+='<line x1="8" x2="48" y1="'+y(r[p[0]])+'" y2="'+y(r[p[0]])+'" stroke="currentColor" stroke-width="2" opacity=".7"/>';});
  svg+='<line x1="2" x2="54" y1="'+y(n.h)+'" y2="'+y(n.h)+'" stroke="var(--gold)" stroke-width="3"/><circle cx="28" cy="'+y(n.h)+'" r="6" fill="var(--gold)"/></svg>';
  var lab='<div class="tll">';
  P.forEach(function(p){lab+='<span style="top:'+y(r[p[0]])+'px">'+pname(p[0],dn)+' '+T(r[p[0]])+'</span>';});
  lab+='<span class="now" style="top:'+Math.min(H-12,Math.max(12,y(n.h)))+'px;inset-inline-end:auto;inset-inline-start:0">الآن '+T(n.h)+'</span></div>';
  function gap(a,b){return dur(b-a);}
  return '<section class="card"><h2>مخطط اليوم في '+esc(c.n)+'</h2><p class="small">من منتصف الليل في الأعلى إلى منتصف الليل التالي في الأسفل. الألوان: الليل، ثم الفجر، ثم النهار، ثم الشفق بعد المغرب.</p><div class="tl">'+lab+svg+'</div></section>'+
    '<section class="card"><h2>المدد بين الأوقات</h2><dl class="ivals"><div><dt>من الفجر إلى الشروق</dt><dd>'+gap(r.fajr,r.sunrise)+'</dd></div><div><dt>من الشروق إلى الظهر</dt><dd>'+gap(r.sunrise,r.dhuhr)+'</dd></div><div><dt>من الظهر إلى العصر</dt><dd>'+gap(r.dhuhr,r.asr)+'</dd></div><div><dt>من العصر إلى المغرب</dt><dd>'+gap(r.asr,r.maghrib)+'</dd></div><div><dt>من المغرب إلى العشاء</dt><dd>'+gap(r.maghrib,r.isha)+'</dd></div><div><dt>من العشاء إلى الفجر</dt><dd>'+dur(fixH(r.fajr-r.isha))+'</dd></div><div><dt>منتصف الليل</dt><dd>'+T(r.midnight)+'</dd></div><div><dt>الثلث الأخير من الليل</dt><dd>'+T(r.lastThird)+'</dd></div></dl></section>';
}
function cityOptions(sel,withGeo){
  var h='';if(withGeo&&S.geo)h+='<option value="geo"'+(sel==='geo'?' selected':'')+'>موقعي الحالي</option>';
  GROUPS.forEach(function(g){h+='<optgroup label="'+g[1]+'">';CITIES.forEach(function(c){if(c[6]===g[0])h+='<option value="'+c[0]+'"'+(c[0]===sel?' selected':'')+'>'+c[1]+'</option>';});h+='</optgroup>';});
  return h;
}
function compareView(){
  var h='<section class="card"><h2>مقارنة مواقيت اليوم بين المدن</h2><div class="cmpsel">';
  S.cmp.forEach(function(id,i){h+='<div class="fld"><label for="cmp'+i+'">المدينة '+dz(i+1)+'</label><select class="sel" id="cmp'+i+'" data-cmp="'+i+'">'+cityOptions(id,false)+'</select></div>';});
  h+='</div><div class="tw"><table style="min-width:520px"><thead><tr><th class="d">الصلاة</th>';
  var cs=S.cmp.map(cityObj),rs=cs.map(function(c){var n=nowIn(c.tz);return times(c,n.y,n.m,n.d);});
  cs.forEach(function(c){h+='<th>'+esc(c.n)+'</th>';});
  h+='</tr></thead><tbody>';
  P.forEach(function(p){h+='<tr><td class="d">'+p[1]+'</td>'+rs.map(function(r){return '<td>'+T(r[p[0]])+'</td>';}).join('')+'</tr>';});
  h+='</tbody></table></div><p class="small">كل مدينة بتوقيتها المحلي وطريقة حساب بلدها، ما لم تختر طريقة محددة في الإعدادات.</p></section>';
  return h;
}
function bearing(lat,lng){var p1=lat*D2R,p2=KAABA[0]*D2R,dl=(KAABA[1]-lng)*D2R;return fixA(Math.atan2(Math.sin(dl),Math.cos(p1)*Math.tan(p2)-Math.sin(p1)*Math.cos(dl))*R2D);}
function distKm(lat,lng){var p1=lat*D2R,p2=KAABA[0]*D2R,dp=p2-p1,dl=(KAABA[1]-lng)*D2R,a=Math.sin(dp/2)*Math.sin(dp/2)+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)*Math.sin(dl/2);return 6371*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));}
function dirName(b){var n=['الشمال','الشمال الشرقي','الشرق','الجنوب الشرقي','الجنوب','الجنوب الغربي','الغرب','الشمال الغربي'];return n[Math.round(b/45)%8];}
function qiblaView(){
  var c=cityObj(S.city),b=bearing(c.lat,c.lng),km=distKm(c.lat,c.lng);
  var ticks='';for(var i=0;i<360;i+=30)ticks+='<line x1="130" y1="14" x2="130" y2="'+(i%90===0?30:24)+'" stroke="currentColor" stroke-width="'+(i%90===0?3:1.5)+'" transform="rotate('+i+' 130 130)" opacity=".7"/>';
  var svg='<svg viewBox="0 0 260 260" role="img" aria-label="سهم اتجاه القبلة"><g id="rose"><circle cx="130" cy="130" r="118" fill="var(--soft)" stroke="var(--line)" stroke-width="2"/>'+ticks+
    '<text x="130" y="50" text-anchor="middle" font-size="22" font-weight="700" fill="var(--down)" font-family="system-ui">N</text><text x="216" y="137" text-anchor="middle" font-size="16" fill="var(--muted)" font-family="system-ui">E</text><text x="130" y="222" text-anchor="middle" font-size="16" fill="var(--muted)" font-family="system-ui">S</text><text x="44" y="137" text-anchor="middle" font-size="16" fill="var(--muted)" font-family="system-ui">W</text>'+
    '<g transform="rotate('+b.toFixed(1)+' 130 130)"><line x1="130" y1="130" x2="130" y2="40" stroke="var(--gold)" stroke-width="7" stroke-linecap="round"/><path d="M130 26l14 22h-28z" fill="var(--gold)"/><rect x="121" y="22" width="18" height="0" fill="none"/></g>'+
    '<circle cx="130" cy="130" r="8" fill="var(--ink)"/></g></svg>';
  return '<section class="card"><h2>اتجاه القبلة من '+esc(c.n)+'</h2><div class="qb">'+svg+'<div><div class="qv">'+dz(b.toFixed(1))+'°</div><p style="margin:4px 0 0">من الشمال باتجاه عقارب الساعة، أي نحو '+dirName(b)+' تقريباً.</p><p class="small">المسافة إلى الكعبة المشرفة نحو '+dz(Math.round(km).toLocaleString('en-US'))+' كم.</p>'+
    '<div class="btns" style="margin-top:12px"><button class="btn pri" type="button" data-act="compass">استخدم بوصلة الجهاز</button></div><p class="small" id="cmpMsg">على الحاسوب: وجّه أعلى الدائرة نحو الشمال الجغرافي، ثم اتبع السهم الذهبي.</p></div></div></section>';
}
function bigView(){
  return '<section class="big" id="big"><div class="bclock" id="bclock"></div><div class="bdate" id="bdate"></div><div class="bnext" id="bnext"></div><div class="btiles" id="btiles"></div>'+
    '<div class="btns noprint" style="justify-content:center"><button class="btn" type="button" data-act="fs">ملء الشاشة</button></div></section><p class="small">مناسبة لعرض المواقيت على شاشة في البيت أو المسجد. تبقى الشاشة مضاءة ما دامت الصفحة مفتوحة إن سمح الجهاز بذلك.</p>';
}
function updateBig(){
  if(!$('big'))return;
  var c=cityObj(S.city),n=nowIn(c.tz),dn=dnOf(n.y,n.m,n.d),r=times(c,n.y,n.m,n.d),nx=nextPrayer(c);
  var sec=Math.floor(Date.now()/1000)%60,clock=fmtT(n.h,true);
  if(!S.h12)clock=dz(p2(Math.floor(n.h))+':'+p2(Math.floor((n.h%1)*60+1e-9)));
  else{var t=Math.floor(n.h*60+1e-9)%1440,H=Math.floor(t/60),M=t%60;clock=dz((H%12===0?12:H%12)+':'+p2(M));}
  $('bclock').textContent=clock+dz(':'+p2(sec));
  $('bdate').textContent=c.n+' — '+WD[wd(dn)]+' '+hTxt(dn)+' — '+gTxt(dn)+' م';
  $('bnext').innerHTML=nx?'<span>بقي على صلاة <b>'+pname(nx.key,nx.dn)+'</b></span><span class="t">'+cdTxt(nx.at-Date.now())+'</span>':'';
  $('btiles').innerHTML=P.map(function(p){return '<div class="'+(nx&&nx.today&&nx.key===p[0]?'next':'')+'"><small>'+pname(p[0],dn)+'</small><b>'+T(r[p[0]])+'</b></div>';}).join('');
}
var WL=null;
function wake(){try{if(navigator.wakeLock&&!WL)navigator.wakeLock.request('screen').then(function(l){WL=l;l.addEventListener('release',function(){WL=null;});}).catch(function(){});}catch(e){}}

function render(){
  headerInfo();renderTabs();
  var h;
  if(S.tab==='today')h=todayView();
  else if(S.tab==='week')h=weekView();
  else if(S.tab==='month'){if(!V.mon){var c=cityObj(S.city),n=nowIn(c.tz);anchorMonth(dnOf(n.y,n.m,n.d));}h=monthView();}
  else if(S.tab==='timeline')h=timelineView();
  else if(S.tab==='compare')h=compareView();
  else if(S.tab==='qibla')h=qiblaView();
  else h=bigView();
  $('view').innerHTML=h;
  updateHero();updateBig();
  if(S.tab==='big')wake();
}
function renderSettings(){
  $('selCity').innerHTML=cityOptions(S.city,true);
  var mh='<option value="auto"'+(S.method==='auto'?' selected':'')+'>تلقائي حسب البلد</option>';
  Object.keys(METHODS).forEach(function(k){mh+='<option value="'+k+'"'+(S.method===k?' selected':'')+'>'+METHODS[k].n+'</option>';});
  $('selMethod').innerHTML=mh;
  $('selAsr').value=String(S.asr);
  $('chkImsak').checked=S.imsak;
  $('adj').innerHTML=P.map(function(p){return '<div class="fld"><label for="adj_'+p[0]+'">'+p[1]+'</label><input class="num" id="adj_'+p[0]+'" data-adj="'+p[0]+'" type="text" inputmode="numeric" dir="ltr" value="'+S.adj[p[0]]+'"></div>';}).join('');
}
function changed(){TC.clear();save();render();}

/* ---------- events ---------- */
function toast(t){var el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){el.classList.remove('on');},2000);}
$('tabs').addEventListener('click',function(e){var b=e.target.closest('.tab');if(!b||b.dataset.t===S.tab)return;S.tab=b.dataset.t;V.off=0;save();render();});
$('btnFmt').addEventListener('click',function(){S.h12=!S.h12;save();render();});
$('btnDig').addEventListener('click',function(){S.digits=S.digits==='ar'?'en':'ar';save();render();});
$('selCity').addEventListener('change',function(){S.city=this.value;V.mon=null;V.off=0;changed();});
$('selMethod').addEventListener('change',function(){S.method=this.value;changed();});
$('selAsr').addEventListener('change',function(){S.asr=+this.value;changed();});
$('chkImsak').addEventListener('change',function(){S.imsak=this.checked;changed();});
$('adj').addEventListener('input',function(e){
  var k=e.target.dataset.adj;if(!k)return;
  var v=parseInt(String(e.target.value).replace(/[٠-٩]/g,function(c){return c.charCodeAt(0)-1632;}).replace('−','-'),10);
  if(isNaN(v)&&e.target.value.trim()!==''&&e.target.value.trim()!=='-')return;
  S.adj[k]=Math.max(-60,Math.min(60,isNaN(v)?0:v));changed();
});
$('btnGeo').addEventListener('click',function(){
  var msg=$('geoMsg');
  if(!navigator.geolocation){msg.textContent='المتصفح لا يدعم تحديد الموقع.';return;}
  msg.textContent='جارٍ تحديد موقعك...';
  navigator.geolocation.getCurrentPosition(function(p){
    var tz='UTC';try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC';}catch(e){}
    S.geo={lat:+p.coords.latitude.toFixed(4),lng:+p.coords.longitude.toFixed(4),tz:tz,cc:''};S.city='geo';V.mon=null;
    msg.textContent='تم تحديد موقعك ('+p.coords.latitude.toFixed(3)+'، '+p.coords.longitude.toFixed(3)+').';
    renderSettings();changed();
  },function(){msg.textContent='لم يُسمح بتحديد الموقع. اختر مدينتك من القائمة، أو اسمح للموقع من إعدادات المتصفح.';},{enableHighAccuracy:false,timeout:15000,maximumAge:600000});
});
$('view').addEventListener('change',function(e){var i=e.target.dataset.cmp;if(i!==undefined){S.cmp[+i]=e.target.value;save();render();}});
$('view').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;var a=b.dataset.act;
  if(a==='dprev'){V.off--;render();}
  else if(a==='dnext'){V.off++;render();}
  else if(a==='dtoday'){V.off=0;render();}
  else if(a==='mbase'){var dn=monthDays().dns[0];S.monthBase=b.dataset.v;anchorMonth(dn!=null?dn+14:dnOf(2026,1,1));save();render();}
  else if(a==='mprev'||a==='mnext'){V.mon.m+=a==='mprev'?-1:1;if(V.mon.m<1){V.mon.m=12;V.mon.y--;}if(V.mon.m>12){V.mon.m=1;V.mon.y++;}render();}
  else if(a==='mnow'){var c=cityObj(S.city),n=nowIn(c.tz);anchorMonth(dnOf(n.y,n.m,n.d));render();}
  else if(a==='print'){try{window.print();}catch(err){toast('الطباعة غير متاحة هنا');}}
  else if(a==='csv')csv();
  else if(a==='fs'){var el=$('big');try{if(document.fullscreenElement)document.exitFullscreen();else if(el.requestFullscreen)el.requestFullscreen().catch(function(){toast('ملء الشاشة غير متاح في هذا المتصفح');});else toast('ملء الشاشة غير متاح في هذا المتصفح');}catch(err){toast('ملء الشاشة غير متاح في هذا المتصفح');}wake();}
  else if(a==='compass')startCompass();
});
function startCompass(){
  var msg=$('cmpMsg');
  function onOri(ev){
    var hd=typeof ev.webkitCompassHeading==='number'?ev.webkitCompassHeading:(ev.absolute&&ev.alpha!=null?360-ev.alpha:null);
    if(hd==null)return;var rose=document.getElementById('rose');if(rose)rose.setAttribute('transform','rotate('+(-hd).toFixed(1)+' 130 130)');
    if(msg)msg.textContent='البوصلة تعمل: أمسك الجهاز مستوياً، ووجّه أعلاه حيث يشير السهم الذهبي.';
  }
  try{
    if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
      DeviceOrientationEvent.requestPermission().then(function(s){if(s==='granted')window.addEventListener('deviceorientation',onOri);else msg.textContent='لم يُسمح باستخدام البوصلة.';}).catch(function(){msg.textContent='تعذّر تشغيل البوصلة على هذا الجهاز.';});
    }else if('ondeviceorientationabsolute' in window){window.addEventListener('deviceorientationabsolute',onOri);msg.textContent='حرّك الجهاز قليلاً لتبدأ البوصلة.';}
    else if('ondeviceorientation' in window){window.addEventListener('deviceorientation',onOri);msg.textContent='حرّك الجهاز قليلاً لتبدأ البوصلة. إن لم تتحرك فجهازك لا يوفر بوصلة للمتصفح.';}
    else msg.textContent='هذا الجهاز لا يوفر بوصلة للمتصفح.';
  }catch(e){msg.textContent='تعذّر تشغيل البوصلة على هذا الجهاز.';}
}
var lastMin=-1;
setInterval(function(){
  if(S.tab==='today')updateHero();
  if(S.tab==='big')updateBig();
  var m=Math.floor(Date.now()/60000);if(m!==lastMin){lastMin=m;headerInfo();if(S.tab==='today'&&V.off===0){var nx=$('hero');if(nx){render();}}}
},1000);
document.addEventListener('visibilitychange',function(){if(!document.hidden&&S.tab==='big'){WL=null;wake();}});

load();renderSettings();render();
})();
</script>
