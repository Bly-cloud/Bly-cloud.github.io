<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10224a">
<meta name="robots" content="noindex">
<meta name="description" content="حوّل بين وحدات الطول والوزن والسرعة والوقت والمساحة والحجم والحرارة والعملات، مع حاسبة البقشيش وحاسبة التمويل العقاري.">

<link rel="icon" type="image/png" href="apple-touch-icon.png">
<title>محوّل الوحدات</title>

<style>
@font-face{font-family:'MajallaLocal';src:local('Sakkal Majalla'),local('SakkalMajalla'),local('Majalla');size-adjust:118%}
/* Layout: navy header band, a searchable list of categories, then one converter card with the value in every unit below it */
:root{
  color-scheme:light;
  --bg:#e7eaef; --card:#f8f9fb; --soft:#eef1f6; --ink:#0f1e3d; --muted:#586379; --line:#d1d7e0;
  --band-a:#0e1d40; --band-b:#1c3566; --band-ink:#f4f6fa; --band-muted:#b6c1d8;
  --sel-bg:#10224a; --sel-fg:#f4f6fa; --accent:#1c3566; --accent-t:#dfe5f0;
  --gold:#a8741a; --gold-t:#f6ecd8; --down:#b8382f; --down-t:#f8e4e2; --up:#0f7a52; --up-t:#e0f1e9;
  --focus:#10224a; --shadow:0 1px 2px rgba(16,34,74,.08),0 10px 26px rgba(16,34,74,.08);
  --font:'MajallaLocal','Sakkal Majalla','Noto Naskh Arabic','Amiri',serif;
  --latin:system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0c121e; --card:#151e32; --soft:#0f1729; --ink:#e8ecf4; --muted:#9aa5ba; --line:#25304a;
    --band-a:#101c3a; --band-b:#1a2d57;
    --sel-bg:#dde4f3; --sel-fg:#0c121e; --accent:#a9c0ff; --accent-t:#1d2a48;
    --gold:#e8be6a; --gold-t:#33291a; --down:#ff8a80; --down-t:#3a1d22; --up:#5fd3a0; --up-t:#123328;
    --focus:#a9c0ff; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px rgba(0,0,0,.3); color-scheme:dark;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.7;padding-bottom:calc(56px + env(safe-area-inset-bottom,0px));min-height:100vh}
button,input,select{font-family:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.in{max-width:960px;margin-inline:auto}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.band{background:linear-gradient(160deg,var(--band-a),var(--band-b));color:var(--band-ink);padding-top:calc(28px + env(safe-area-inset-top,0px));padding-bottom:24px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px 16px}
.brand{display:flex;align-items:center;gap:12px;font:700 clamp(26px,5.6vw,38px)/1.35 var(--font);margin:0}
.brand svg{flex:none}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;background:transparent;border:1.5px solid rgba(244,246,250,.4);color:var(--band-ink);border-radius:999px;padding:4px 16px;font:600 16px/1.3 var(--font);min-height:44px}
.chip:hover{background:rgba(244,246,250,.12)}
.chip select{border:0;background:transparent;color:inherit;font:700 16px var(--font);padding:0 2px}
.chip select option{color:#10224a;background:#fff}
.chip:focus-visible,.chip select:focus-visible{outline-color:#f4f6fa}
.search{margin-top:18px;position:relative}
.search input{width:100%;border:1.5px solid rgba(244,246,250,.3);background:rgba(244,246,250,.1);color:var(--band-ink);border-radius:14px;padding:10px 46px 10px 14px;font:600 19px/1.4 var(--font);min-height:50px}
.search input::placeholder{color:var(--band-muted)}
.search input:focus{outline:none;border-color:#f4f6fa;background:rgba(244,246,250,.16)}
.search svg{position:absolute;right:14px;top:50%;transform:translateY(-50%);pointer-events:none}

main{padding-top:22px}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.cat{display:grid;grid-template-columns:56px minmax(0,1fr);gap:4px 14px;align-items:center;text-align:start;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow);color:var(--ink);min-width:0}
.cat:hover{border-color:var(--accent)}
.ic{grid-row:1/4;width:56px;height:56px;border-radius:15px;background:var(--accent-t);color:var(--accent);display:grid;place-items:center;font:700 19px/1 var(--latin);direction:ltr}
.cn{font:700 22px/1.35 var(--font)}
.ce{font:500 14px/1.3 var(--latin);color:var(--muted);direction:ltr;text-align:right}
.cu{font-size:15px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr;text-align:right;font-family:var(--latin)}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:18px;padding:20px;color:var(--muted)}

.back{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 16px;font:600 17px/1.4 var(--font);min-height:44px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;min-width:0;margin-bottom:18px}
.card h2{margin:0;font:700 22px/1.4 var(--font)}
.head{display:flex;align-items:center;gap:12px}
.head .ic{grid-row:auto}
.head h1{margin:0;font:700 26px/1.35 var(--font)}
.head small{display:block;font:500 15px/1.3 var(--latin);color:var(--muted);direction:ltr;text-align:right}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>label,.flbl{font:600 18px/1.4 var(--font);color:var(--muted)}
.num,.sel{border:1.5px solid var(--line);border-radius:14px;background:var(--soft);color:var(--ink);padding:6px 12px;min-height:52px;min-width:0;width:100%}
.num{direction:ltr;text-align:center;font:700 28px/1.3 var(--latin);font-variant-numeric:tabular-nums}
.sel{font:600 19px/1.4 var(--font)}
.num:focus,.sel:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-t)}
.num.bad{border-color:var(--down);background:var(--down-t)}
.pair{display:grid;grid-template-columns:minmax(0,1fr) 52px minmax(0,1fr);gap:10px;align-items:end}
.swap{height:52px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);display:grid;place-items:center}
.result{background:var(--accent-t);border-radius:16px;padding:12px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.rv{font:700 clamp(30px,7vw,46px)/1.25 var(--latin);color:var(--accent);direction:ltr;text-align:right;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.rs{color:var(--muted);font-size:18px}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{padding:6px 18px;border-radius:999px;font:700 17px/1.4 var(--font);border:1.5px solid var(--line);background:var(--card);color:var(--ink);min-height:44px}
.btn.pri{background:var(--sel-bg);border-color:var(--sel-bg);color:var(--sel-fg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.pc{border:1.5px solid var(--line);background:var(--soft);color:var(--ink);border-radius:999px;padding:2px 14px;font:600 17px/1.7 var(--latin);min-height:40px}
.pc[aria-pressed="true"]{background:var(--sel-bg);border-color:var(--sel-bg);color:var(--sel-fg)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{flex:1 1 160px;border:1.5px solid var(--line);background:var(--soft);color:var(--ink);border-radius:14px;padding:8px 12px;font:600 18px/1.4 var(--font);min-height:48px}
.seg button[aria-pressed="true"]{background:var(--sel-bg);border-color:var(--sel-bg);color:var(--sel-fg)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}

.all{display:flex;flex-direction:column}
.row{font-size:19px;line-height:1.5;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 6px;border-top:1px solid var(--line);background:transparent;border-left:0;border-right:0;border-bottom:0;color:var(--ink);text-align:start;width:100%;min-height:52px}
.row:first-child{border-top:0}
.row:hover{background:var(--soft)}
.row[aria-pressed="true"]{background:var(--accent-t)}
.row .u{min-width:0}
.row .u b{font-weight:700}
.row .u small{display:block;color:var(--muted);font:500 14px/1.3 var(--latin);direction:ltr;text-align:right}
.row .v{font:700 19px/1.4 var(--latin);direction:ltr;text-align:left;overflow-wrap:anywhere;font-variant-numeric:tabular-nums;min-width:0}
.row.x{cursor:default}
.note{margin:0;font-size:16px;color:var(--gold);background:var(--gold-t);border-radius:12px;padding:6px 12px}
.note a{color:inherit}
.err{margin:0;font:700 19px/1.7 var(--font);color:var(--down)}
.mains{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.main{background:var(--accent-t);border-radius:16px;padding:10px 14px;min-width:0}
.main.up{background:var(--up-t)}
.main small{display:block;color:var(--muted);font-weight:600;font-size:16px}
.main b{display:block;font:700 clamp(26px,6vw,34px)/1.3 var(--latin);color:var(--accent);direction:ltr;text-align:right;overflow-wrap:anywhere}
.main.up b{color:var(--up)}
.rows{margin:0}
.rows div{display:flex;justify-content:space-between;gap:12px;padding:8px 2px;border-top:1px solid var(--line)}
.rows dt{color:var(--muted);font-weight:600}
.rows dd{margin:0;font:700 19px/1.5 var(--latin);direction:ltr;text-align:left}
.stepper{display:grid;grid-template-columns:52px minmax(0,1fr) 52px;gap:8px}
.stepper button{border:1.5px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:700 26px/1 var(--latin)}
.toast{position:fixed;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));margin-inline:auto;width:fit-content;max-width:calc(100% - 32px);background:var(--sel-bg);color:var(--sel-fg);border-radius:999px;padding:8px 22px;font:700 18px/1.5 var(--font);opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.toast.on{opacity:1}
@media (max-width:520px){.pair{grid-template-columns:minmax(0,1fr) 48px minmax(0,1fr);gap:8px}.sel{font-size:17px;padding:6px 8px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

</header>
<main class="pad"><div class="in" id="view"></div></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

  BDT:'تاكا بنغلاديشية',IDR:'روبية إندونيسية',MYR:'رينغيت ماليزي',PHP:'بيزو فلبيني',KRW:'وون كوري',CHF:'فرنك سويسري',CAD:'دولار كندي',AUD:'دولار أسترالي',
  NZD:'دولار نيوزيلندي',RUB:'روبل روسي',ZAR:'راند جنوب أفريقي',SEK:'كرونة سويدية',NOK:'كرونة نرويجية',DKK:'كرونة دنماركية',SGD:'دولار سنغافوري',HKD:'دولار هونغ كونغ',
  THB:'بات تايلندي',BRL:'ريال برازيلي',MXN:'بيزو مكسيكي',NGN:'نيرة نيجيرية',ETB:'بير إثيوبي',KES:'شلن كيني',IRR:'ريال إيراني',AFN:'أفغاني',LKR:'روبية سريلانكية',NPR:'روبية نيبالية'};
var POPULAR=['USD','SAR','EUR','GBP','AED','KWD','QAR','BHD','OMR','EGP','JOD','TRY','CNY','JPY','INR','PKR','CHF','CAD','AUD','MAD'];
var PEGGED={USD:1,SAR:3.75,AED:3.6725,QAR:3.64,BHD:0.376,OMR:0.3845,JOD:0.709};

/* ---------- state ---------- */
var S={digits:'en',prec:4,view:'home',c:{},tip:{a:'250',p:'15',n:'1'},mort:{price:'1000000',down:'10',rate:'5',years:'25',m:'amort'}};
var R={rates:null,time:'',src:''},Q='',LAST='',showAllCur=false;
function load(){
  try{
    var o=JSON.parse(localStorage.getItem(KEY)||'null');
    if(o){
      if(o.digits==='ar'||o.digits==='en')S.digits=o.digits;
      if([2,4,6,8].indexOf(o.prec)>=0)S.prec=o.prec;
      if(o.c&&typeof o.c==='object')S.c=o.c;
      if(o.tip&&typeof o.tip==='object')S.tip=Object.assign(S.tip,o.tip);
      if(o.mort&&typeof o.mort==='object')S.mort=Object.assign(S.mort,o.mort);
    }
    var r=JSON.parse(localStorage.getItem(RKEY)||'null');
    if(r&&r.rates&&typeof r.rates==='object'){R.rates=r.rates;R.time=r.time||'';R.at=r.at||0;R.src='cache';}
  }catch(e){}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify({digits:S.digits,prec:S.prec,c:S.c,tip:S.tip,mort:S.mort}));}catch(e){}}

/* ---------- numbers ---------- */
function dz(s){s=String(s);return S.digits==='ar'?s.replace(/\d/g,function(d){return DIG[+d];}):s;}
function parse(s){
  if(s==null)return NaN;
  s=String(s).replace(/[٠-٩]/g,function(c){return c.charCodeAt(0)-1632;}).replace(/[۰-۹]/g,function(c){return c.charCodeAt(0)-1776;})
    .replace(/[٬،,\s]/g,'').replace(/٫/g,'.');
  if(!/^-?\d*\.?\d*(e-?\d+)?$/i.test(s)||s===''||s==='-'||s==='.')return NaN;
  return parseFloat(s);
}
function fmt(x,prec){
  if(!isFinite(x))return '—';
  if(prec==null)prec=S.prec;
  if(x!==0)x=parseFloat(x.toPrecision(12));
  var a=Math.abs(x),s;
  if(a!==0&&(a>=1e15||a<Math.pow(10,-prec))){
    s=x.toExponential(Math.min(prec,6)).replace(/\.?0+e/,'e').replace('e+','e');
    var m=s.split('e'),SUP='⁰¹²³⁴⁵⁶⁷⁸⁹';
    return dz(m[0].replace('-','−'))+' × 10'+m[1].replace('-','⁻').replace(/\d/g,function(d){return SUP[+d];});
  }
  s=a.toFixed(prec);
  if(prec>0)s=s.replace(/\.?0+$/,'');
  var p=s.split('.');
  p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,S.digits==='ar'?'٬':',');
  s=p.join(S.digits==='ar'?'٫':'.');
  var neg=x<0&&parseFloat(a.toFixed(prec))!==0;
  return (neg?'−':'')+dz(s);
}
function money(x){return fmt(x,2);}

/* ---------- currency ---------- */
function curList(){
  var codes=Object.keys(R.rates||PEGGED);
  var pop=POPULAR.filter(function(c){return codes.indexOf(c)>=0;});
  var rest=codes.filter(function(c){return pop.indexOf(c)<0;}).sort();
  return pop.concat(rest);
}
function curUnits(){return curList().map(function(c){return [c,CUR_AR[c]||c,c,c];});}
function rate(c){var r=R.rates||PEGGED;return r[c];}
function fetchRates(force){
  if(!force&&R.rates&&R.src!=='fallback'&&Date.now()-(R.at||0)<6*3600e3)return;
  var c=typeof AbortController==='function'?new AbortController():null,t=c?setTimeout(function(){c.abort();},9000):0;
  R.loading=true;if(S.view==='currency')render();
  fetch('https://open.er-api.com/v6/latest/USD',c?{signal:c.signal}:{}).then(function(r){return r.json();}).then(function(d){
    clearTimeout(t);R.loading=false;
    if(d&&d.result==='success'&&d.rates&&d.rates.SAR){
      R.rates=d.rates;R.time=d.time_last_update_utc||'';R.at=Date.now();R.src='live';
      try{localStorage.setItem(RKEY,JSON.stringify({rates:R.rates,time:R.time,at:R.at}));}catch(e){}
    }else if(!R.rates)R.src='fallback';
    if(S.view==='currency')render();
  }).catch(function(){clearTimeout(t);R.loading=false;if(!R.rates)R.src='fallback';if(S.view==='currency')render();});
}

/* ---------- conversion ---------- */
function cat(id){for(var i=0;i<CATS.length;i++)if(CATS[i].id===id)return CATS[i];return null;}
function units(c){return c.kind==='cur'?curUnits():c.u;}
function unit(c,k){var u=units(c);for(var i=0;i<u.length;i++)if(u[i][0]===k)return u[i];return u[0];}
function conv(c,v,from,to){
  if(c.kind==='temp')return FROMC[to](TOC[from](v));
  if(c.kind==='cur'){var a=rate(from),b=rate(to);return (a&&b)?v/a*b:NaN;}
  return v*unit(c,from)[4]/unit(c,to)[4];
}
function cs(c){
  var st=S.c[c.id];
  if(!st||typeof st!=='object')st=S.c[c.id]={v:'1',from:c.def[0],to:c.def[1]};
  var ks=units(c).map(function(u){return u[0];});
  if(ks.indexOf(st.from)<0)st.from=ks.indexOf(c.def[0])>=0?c.def[0]:ks[0];
  if(ks.indexOf(st.to)<0)st.to=ks.indexOf(c.def[1])>=0?c.def[1]:ks[1];
  return st;
}
function extraRows(c,v,from){
  var out=[],base;
  if(c.extra==='ftin'){base=v*unit(c,from)[4];var tin=base/0.0254,neg=tin<0;tin=Math.abs(tin);var ft=Math.floor(tin/12),inch=tin-ft*12;if(inch>11.99995){ft++;inch=0;}
    out.push(['قدم وبوصة','Feet and inches',(neg?'−':'')+fmt(ft,0)+' ft '+fmt(inch,2)+' in']);}
  if(c.extra==='lboz'){base=v*unit(c,from)[4];var tlb=Math.abs(base)/0.45359237,lb=Math.floor(tlb),oz=(tlb-lb)*16;if(oz>15.99995){lb++;oz=0;}
    out.push(['رطل وأونصة','Pounds and ounces',(base<0?'−':'')+fmt(lb,0)+' lb '+fmt(oz,2)+' oz']);}
  if(c.extra==='dhms'){base=Math.abs(v*unit(c,from)[4]);var d=Math.floor(base/86400),h=Math.floor(base%86400/3600),mi=Math.floor(base%3600/60),se=base%60;
    out.push(['أيام وساعات ودقائق وثوانٍ','Days, hours, minutes, seconds',fmt(d,0)+' d '+fmt(h,0)+' h '+fmt(mi,0)+' min '+fmt(se,2)+' s']);}
  return out;
}

/* ---------- views ---------- */
function icon(c){return '<span class="ic" aria-hidden="true">'+c.ic+'</span>';}
function preview(c){
  if(c.kind==='cur')return 'USD, SAR, EUR, GBP, AED, KWD, QAR, EGP...';
  if(c.kind==='tip')return 'Amount, Percent, Tip, Total, People, Each';
  if(c.kind==='mort')return 'Price, Down, Rate, Term, Monthly payment';
  return c.u.map(function(u){return u[3];}).join(', ');
}
function norm(s){return String(s).toLowerCase().replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/[ً-ْ]/g,'');}
function homeHTML(){
  var q=norm(Q.trim()),list=CATS.filter(function(c){
    if(!q)return true;
    var hay=[c.ar,c.en,preview(c)].concat(c.u?c.u.map(function(u){return u[1]+' '+u[2]+' '+u[3];}):[]);
    if(c.kind==='cur')hay=hay.concat(Object.keys(CUR_AR).map(function(k){return k+' '+CUR_AR[k];}));
    return norm(hay.join(' ')).indexOf(q)>=0;
  });
  if(!list.length)return '<div class="empty">لا توجد نتيجة لبحثك. جرّب اسم وحدة آخر، مثل: متر أو رطل أو دولار.</div>';
  return '<div class="cats">'+list.map(function(c){
    return '<button class="cat" type="button" data-cat="'+c.id+'">'+icon(c)+'<span class="cn">'+c.ar+'</span><span class="ce">'+c.en+'</span><span class="cu">'+esc(preview(c))+'</span></button>';
  }).join('')+'</div>';
}
function headHTML(c){return '<button class="back" type="button" data-act="home">→ كل الفئات</button><div class="card"><div class="head">'+icon(c)+'<div><h1>'+c.ar+'</h1><small>'+c.en+'</small></div></div></div>';}
function optList(c,sel){return units(c).map(function(u){return '<option value="'+u[0]+'"'+(u[0]===sel?' selected':'')+'>'+esc(u[1])+' ('+esc(u[3])+')</option>';}).join('');}
function convHTML(c){
  var st=cs(c);
  var h=headHTML(c)+'<section class="card"><div class="fld"><label for="val">القيمة</label><input class="num" id="val" type="text" inputmode="decimal" autocomplete="off" dir="ltr" value="'+esc(st.v)+'"></div>'+
    '<div class="pair"><div class="fld"><label for="from">من</label><select class="sel" id="from">'+optList(c,st.from)+'</select></div>'+
    '<button class="swap" type="button" data-act="swap" aria-label="تبديل الوحدتين"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h14l-4-4M20 16H6l4 4"/></svg></button>'+
    '<div class="fld"><label for="to">إلى</label><select class="sel" id="to">'+optList(c,st.to)+'</select></div></div>'+
    '<div id="res"></div></section>';
  if(c.kind==='cur'){
    var note;
    if(R.loading&&!R.rates)note='جارٍ جلب أسعار الصرف...';
    else if(R.src==='fallback')note='تعذّر جلب الأسعار الحية. تظهر الآن العملات المربوطة بالدولار فقط بأسعارها الثابتة.';
    else{var t=R.time?new Date(R.time):null;note='الأسعار للاسترشاد، وآخر تحديث لها '+(t&&!isNaN(t)?dz(t.getUTCDate()+'/'+(t.getUTCMonth()+1)+'/'+t.getUTCFullYear()):'غير معروف')+'. المصدر: <a href="https://www.exchangerate-api.com" target="_blank" rel="noopener">ExchangeRate-API</a>.';}
    h+='<p class="note">'+note+'</p><div class="btns" style="margin-bottom:18px"><button class="btn" type="button" data-act="rates">تحديث الأسعار</button></div>';
  }
  h+='<section class="card"><h2>القيمة بكل الوحدات</h2><div class="all" id="all"></div>'+(c.kind==='cur'?'<button class="btn" type="button" data-act="allcur">'+(showAllCur?'عرض العملات الشائعة فقط':'عرض كل العملات')+'</button>':'')+'</section>';
  return h;
}
function convUpdate(c){
  var st=cs(c),v=parse(st.v),inp=$('val');
  var bad=isNaN(v)&&String(st.v).trim()!=='';if(inp){inp.classList.toggle('bad',bad);inp.setAttribute('aria-invalid',String(bad));}
  if(isNaN(v)){$('res').innerHTML='<p class="err">اكتب رقماً في خانة القيمة.</p>';$('all').innerHTML='';return;}
  if(c.kind==='temp'&&TOC[st.from](v)<-273.15-1e-9){$('res').innerHTML='<p class="err">هذه الدرجة أقل من الصفر المطلق، وهي أدنى حرارة ممكنة.</p>';$('all').innerHTML='';return;}
  var fu=unit(c,st.from),tu=unit(c,st.to),r=conv(c,v,st.from,st.to);
  LAST=fmt(v).replace(/٬/g,'')+' '+fu[3]+' = '+fmt(r)+' '+tu[3];
  $('res').innerHTML='<div class="result"><div class="rv">'+fmt(r)+' <span style="font-size:.55em">'+esc(tu[3])+'</span></div><div class="rs">'+esc(fmt(v))+' '+esc(fu[1])+' = '+esc(fmt(r))+' '+esc(tu[1])+'</div></div>'+
    (c.kind==='cur'&&isFinite(r)?'<div class="rs">'+dz('1')+' '+esc(fu[3])+' = '+fmt(conv(c,1,st.from,st.to))+' '+esc(tu[3])+'</div>':'')+
    '<div class="btns"><button class="btn pri" type="button" data-act="copy">نسخ النتيجة</button></div>';
  var list=units(c);
  if(c.kind==='cur'&&!showAllCur)list=list.filter(function(u){return POPULAR.indexOf(u[0])>=0||u[0]===st.from||u[0]===st.to;});
  var h=list.map(function(u){
    return '<button class="row" type="button" data-to="'+u[0]+'" aria-pressed="'+(u[0]===st.to)+'"><span class="u"><b>'+esc(u[1])+'</b><small>'+esc(u[2]===u[3]?u[2]:u[2]+' ('+u[3]+')')+'</small></span><span class="v">'+fmt(conv(c,v,st.from,u[0]))+' '+esc(u[3])+'</span></button>';
  }).join('');
  extraRows(c,v,st.from).forEach(function(x){h+='<div class="row x"><span class="u"><b>'+x[0]+'</b><small>'+x[1]+'</small></span><span class="v">'+x[2]+'</span></div>';});
  $('all').innerHTML=h;
}
function numFld(id,label,val,unitTxt){return '<div class="fld"><label for="'+id+'">'+label+(unitTxt?' <small>('+unitTxt+')</small>':'')+'</label><input class="num" id="'+id+'" type="text" inputmode="decimal" autocomplete="off" dir="ltr" value="'+esc(val)+'"></div>';}
function chips(key,vals,cur,suffix){return '<div class="chips">'+vals.map(function(x){return '<button class="pc" type="button" data-chip="'+key+'" data-v="'+x+'" aria-pressed="'+(parse(cur)===x)+'">'+dz(x)+(suffix||'')+'</button>';}).join('')+'</div>';}
function tipHTML(c){
  var t=S.tip;
  return headHTML(c)+'<section class="card"><div class="grid2">'+numFld('ta','المبلغ',t.a)+'<div class="fld">'+numFld('tp','نسبة البقشيش',t.p,'%').replace('<div class="fld">','').replace(/<\/div>$/,'')+chips('tp',[10,15,18,20,25],t.p,'%')+'</div>'+
    '<div class="fld"><label for="tn">عدد الأشخاص</label><div class="stepper"><button type="button" data-act="tn-" aria-label="أنقص شخصاً">−</button><input class="num" id="tn" type="text" inputmode="numeric" dir="ltr" value="'+esc(t.n)+'"><button type="button" data-act="tn+" aria-label="زد شخصاً">+</button></div></div></div></section><div id="res"></div>';
}
function tipUpdate(){
  var t=S.tip,a=parse(t.a),p=parse(t.p),n=parse(t.n);
  if(isNaN(a)||isNaN(p)||isNaN(n)){$('res').innerHTML='<section class="card"><p class="err">اكتب رقماً في كل خانة.</p></section>';return;}
  if(n<1||n%1){$('res').innerHTML='<section class="card"><p class="err">عدد الأشخاص يجب أن يكون عدداً صحيحاً من ١ فأكثر.</p></section>';return;}
  var tip=a*p/100,tot=a+tip,each=tot/n;
  LAST='البقشيش: '+money(tip)+'، الإجمالي: '+money(tot)+(n>1?'، على كل شخص: '+money(each):'');
  $('res').innerHTML='<section class="card"><div class="mains"><div class="main"><small>البقشيش</small><b>'+money(tip)+'</b></div><div class="main"><small>الإجمالي</small><b>'+money(tot)+'</b></div>'+
    (n>1?'<div class="main up"><small>على كل شخص</small><b>'+money(each)+'</b></div><div class="main"><small>بقشيش كل شخص</small><b>'+money(tip/n)+'</b></div>':'')+
    '</div><div class="btns"><button class="btn pri" type="button" data-act="copy">نسخ النتيجة</button></div></section>';
}
function mortHTML(c){
  var m=S.mort;
  return headHTML(c)+'<section class="card"><div class="seg" role="group" aria-label="طريقة الحساب"><button type="button" data-act="mm" data-v="amort" aria-pressed="'+(m.m==='amort')+'">متناقص (قرض عادي)</button><button type="button" data-act="mm" data-v="flat" aria-pressed="'+(m.m==='flat')+'">ثابت (مرابحة)</button></div>'+
    '<div class="grid2">'+numFld('mp','سعر العقار',m.price)+
    '<div class="fld">'+numFld('md','الدفعة الأولى',m.down,'%').replace('<div class="fld">','').replace(/<\/div>$/,'')+chips('md',[0,10,20,30],m.down,'%')+'</div>'+
    numFld('mr','نسبة الربح أو الفائدة السنوية',m.rate,'%')+
    '<div class="fld">'+numFld('my','مدة التمويل',m.years,'سنوات').replace('<div class="fld">','').replace(/<\/div>$/,'')+chips('my',[5,10,15,20,25,30],m.years,'')+'</div></div></section><div id="res"></div>';
}
function mortUpdate(){
  var m=S.mort,P=parse(m.price),d=parse(m.down),r=parse(m.rate),y=parse(m.years);
  if([P,d,r,y].some(isNaN)){$('res').innerHTML='<section class="card"><p class="err">اكتب رقماً في كل خانة.</p></section>';return;}
  if(d<0||d>100||y<=0||r<0){$('res').innerHTML='<section class="card"><p class="err">راجع الأرقام: الدفعة الأولى من ٠ إلى ١٠٠٪، والمدة أكبر من صفر، والنسبة ليست سالبة.</p></section>';return;}
  var down=P*d/100,L=P-down,n=Math.round(y*12),pmt,interest;
  if(m.m==='flat'){interest=L*r/100*y;pmt=(L+interest)/n;}
  else{var i=r/100/12;pmt=i?L*i/(1-Math.pow(1+i,-n)):L/n;interest=pmt*n-L;}
  var total=pmt*n;
  LAST='القسط الشهري: '+money(pmt)+'، مبلغ التمويل: '+money(L)+'، إجمالي الربح: '+money(interest);
  $('res').innerHTML='<section class="card"><div class="mains"><div class="main up"><small>القسط الشهري</small><b>'+money(pmt)+'</b></div><div class="main"><small>مبلغ التمويل</small><b>'+money(L)+'</b></div></div>'+
    '<dl class="rows"><div><dt>الدفعة الأولى</dt><dd>'+money(down)+'</dd></div><div><dt>عدد الأقساط</dt><dd>'+dz(n)+'</dd></div><div><dt>إجمالي الربح أو الفائدة</dt><dd>'+money(interest)+'</dd></div><div><dt>إجمالي ما يُسدَّد للتمويل</dt><dd>'+money(total)+'</dd></div><div><dt>التكلفة الكلية مع الدفعة الأولى</dt><dd>'+money(total+down)+'</dd></div></dl>'+
    '<p class="note">'+(m.m==='flat'?'الطريقة الثابتة تحسب الربح على كامل مبلغ التمويل طوال المدة، وهي الشائعة في عقود المرابحة.':'الطريقة المتناقصة تحسب الفائدة على الرصيد المتبقي كل شهر، وهي طريقة القروض العقارية المعتادة.')+' الأرقام تقديرية، والعرض الرسمي من جهة التمويل هو المرجع.</p>'+
    '<div class="btns"><button class="btn pri" type="button" data-act="copy">نسخ النتيجة</button></div></section>';
}
function render(){
  $('btnDig').textContent='الأرقام: '+(S.digits==='ar'?'٣ ٢ ١':'1 2 3');
  $('selPrec').value=String(S.prec);
  $('searchBox').hidden=S.view!=='home';
  var v=$('view');
  if(S.view==='home'){v.innerHTML=homeHTML();return;}
  var c=cat(S.view);if(!c){S.view='home';render();return;}
  if(c.kind==='tip'){v.innerHTML=tipHTML(c);tipUpdate();}
  else if(c.kind==='mort'){v.innerHTML=mortHTML(c);mortUpdate();}
  else{v.innerHTML=convHTML(c);convUpdate(c);}
}
function update(){
  var c=cat(S.view);if(!c)return;
  if(c.kind==='tip')tipUpdate();else if(c.kind==='mort')mortUpdate();else convUpdate(c);
}

/* ---------- events ---------- */
function toast(t){var el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){el.classList.remove('on');},1800);}
function copyText(t){
  function fb(){try{var ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();var ok=document.execCommand('copy');ta.remove();toast(ok?'تم النسخ':'حدّد النص يدوياً وانسخه');}catch(e){toast('حدّد النص يدوياً وانسخه');}}
  try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(function(){toast('تم النسخ');},fb);else fb();}catch(e){fb();}
}
function open(id){S.view=id;var c=cat(id);if(c&&c.kind==='cur')fetchRates(false);render();try{window.scrollTo(0,0);}catch(e){}}
$('q').addEventListener('input',function(){Q=this.value;if(S.view==='home')$('view').innerHTML=homeHTML();});
$('btnDig').addEventListener('click',function(){S.digits=S.digits==='ar'?'en':'ar';save();render();});
$('selPrec').addEventListener('change',function(){S.prec=+this.value;save();render();});
var MAP={val:['c','v'],from:['c','from'],to:['c','to'],ta:['tip','a'],tp:['tip','p'],tn:['tip','n'],mp:['mort','price'],md:['mort','down'],mr:['mort','rate'],my:['mort','years']};
function onIn(e){
  var t=e.target,m=MAP[t.id];if(!m)return;
  if(m[0]==='c'){var c=cat(S.view);cs(c)[m[1]]=t.value;if(t.id!=='val'){convUpdate(c);}else convUpdate(c);}
  else{S[m[0]][m[1]]=t.value;
    Array.prototype.forEach.call(document.querySelectorAll('.pc[data-chip="'+t.id+'"]'),function(b){b.setAttribute('aria-pressed',String(parse(t.value)===+b.dataset.v));});
    update();}
  save();
}
$('view').addEventListener('input',onIn);
$('view').addEventListener('change',onIn);
$('view').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  if(b.dataset.cat){open(b.dataset.cat);return;}
  var c=cat(S.view),a=b.dataset.act;
  if(b.dataset.to&&c){cs(c).to=b.dataset.to;$('to').value=b.dataset.to;save();convUpdate(c);toast('صارت الوحدة الهدف: '+unit(c,b.dataset.to)[1]);return;}
  if(b.dataset.chip){var k=b.dataset.chip,inp=$(k);inp.value=b.dataset.v;onIn({target:inp});return;}
  if(a==='home'){S.view='home';render();var btn=document.querySelector('[data-cat="'+c.id+'"]');if(btn)btn.focus();}
  else if(a==='swap'){var st=cs(c),x=st.from;st.from=st.to;st.to=x;$('from').value=st.from;$('to').value=st.to;save();convUpdate(c);}
  else if(a==='copy')copyText(LAST);
  else if(a==='rates')fetchRates(true);
  else if(a==='allcur'){showAllCur=!showAllCur;render();}
  else if(a==='tn-'||a==='tn+'){var n=parse(S.tip.n);if(isNaN(n))n=1;n=Math.max(1,Math.round(n)+(a==='tn+'?1:-1));S.tip.n=String(n);$('tn').value=S.tip.n;save();tipUpdate();}
  else if(a==='mm'){S.mort.m=b.dataset.v;save();render();}
});

load();render();
})();
</script>
</body>
</html>
