<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10224a">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<title>مواقعي</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap">
<style>
/* خط Sakkal Majalla يظهر على الأجهزة المثبّت عليها، وغيرها يعرض الخط الاحتياطي المشابه */
@font-face{font-family:'MajallaLocal';src:local('Sakkal Majalla'),local('SakkalMajalla'),local('Majalla');size-adjust:118%}
:root{
  color-scheme:light;
  --bg:#e7eaef; --card:#f8f9fb; --ink:#0f1e3d; --muted:#586379; --line:#d1d7e0;
  --band-a:#0e1d40; --band-b:#1c3566; --band-ink:#f4f6fa; --band-muted:#b6c1d8;
  --btn-bg:#10224a; --btn-fg:#f4f6fa; --focus:#10224a;
  --shadow:0 1px 2px rgba(16,34,74,.08),0 10px 26px rgba(16,34,74,.08);
  --font:'MajallaLocal','Sakkal Majalla','Noto Naskh Arabic','Amiri',serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0c121e; --card:#151e32; --ink:#e8ecf4; --muted:#9aa5ba; --line:#25304a;
    --band-a:#101c3a; --band-b:#1a2d57; --btn-bg:#dde4f3; --btn-fg:#0c121e; --focus:#a9c0ff;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px rgba(0,0,0,.3); color-scheme:dark;
  }
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.7;
  padding-bottom:calc(56px + env(safe-area-inset-bottom,0px));min-height:100vh;
}
.in{max-width:920px;margin-inline:auto}
.band{
  background:linear-gradient(160deg,var(--band-a),var(--band-b));color:var(--band-ink);
  padding-top:calc(44px + env(safe-area-inset-top,0px));padding-bottom:40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 16px}
h1{font:700 clamp(36px,8vw,54px)/1.4 var(--font);margin:0;letter-spacing:0}
.lead{margin:6px 0 0;color:var(--band-muted);max-width:50ch;font-size:18px}
.chip{display:inline-flex;align-items:center;background:transparent;border:1.5px solid rgba(244,246,250,.4);color:var(--band-ink);border-radius:999px;padding:6px 18px;font:500 15px/1.2 var(--font);min-height:44px;cursor:pointer}
.chip:hover{background:rgba(244,246,250,.12)}
.main{padding:26px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.status{margin:0 0 18px;color:var(--muted);min-height:1.7em;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
a.card{
  display:flex;flex-direction:column;gap:10px;min-width:0;padding:20px;border-radius:20px;text-decoration:none;
  background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow);
  transition:transform .15s,box-shadow .15s;
}
a.card:hover{transform:translateY(-3px)}
a.card:active{transform:translateY(0)}
a.card:focus-visible,.chip:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.ico{width:60px;height:60px;border-radius:15px;display:block;object-fit:cover}
.ico.ph{display:grid;place-items:center;color:#f4f6fa;font:700 30px/1 var(--font)}
.ttl{font:700 22px/1.55 var(--font);overflow-wrap:anywhere}
.dsc{color:var(--muted);font-size:16px;line-height:1.7;overflow-wrap:anywhere}
.go{margin-top:auto;align-self:flex-start;background:var(--btn-bg);color:var(--btn-fg);border-radius:999px;padding:4px 20px;font:600 15px/1.7 var(--font)}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:20px;padding:22px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="band">
  <div class="in head">
    <div>
      <h1>مواقعي</h1>
      <p class="lead">كل موقع هنا له غرض محدد. تظهر المواقع الجديدة تلقائياً بعد نشرها.</p>
    </div>
    <button class="chip" id="btnRef" type="button">تحديث القائمة</button>
  </div>
</header>
<main class="main">
  <div class="in">
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <div class="grid" id="grid"></div>
  </div>
</main>
<script>
(function(){
'use strict';
/* إعدادات الصفحة، ولا تحتاج لتعديلها عادة */
var USER=/\.github\.io$/.test(location.hostname)?location.hostname.split('.')[0]:'bly-cloud';
var HOME_REPO=(USER+'.github.io').toLowerCase();
var ONLY_TOPIC='';            /* اكتب وسماً مثل mysite لتعرض المستودعات التي تحمل هذا الوسم فقط */
var EXTRA=[{folder:'percentage-calculator'},{folder:'date-converter'},{folder:'unit-converter'},{folder:'prayer-times'},{folder:'word-builder'},{folder:'math-puzzles'},{folder:'timers'}];                 /* مواقع تقع داخل مجلدات هذا المستودع نفسه، مثل: [{folder:'math-puzzles'}] */
var TTL=3600000, KEY='sites-home-cache-v1';
var COLORS=['#1f3a68','#4a5a78','#2c4a7c','#5b6b86','#243b5e','#3d4f70'];

function $(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function readCache(){try{var o=JSON.parse(localStorage.getItem(KEY));if(o&&Array.isArray(o.items))return o;}catch(e){}return null;}
function writeCache(items){try{localStorage.setItem(KEY,JSON.stringify({t:Date.now(),items:items}));}catch(e){}}
function timed(url,ms){
  var c=typeof AbortController==='function'?new AbortController():null,t;
  if(c)t=setTimeout(function(){c.abort();},ms);
  return fetch(url,c?{signal:c.signal}:{}).then(function(r){clearTimeout(t);return r;},function(e){clearTimeout(t);throw e;});
}
function enrich(s){
  var out={folder:s.folder,title:s.folder,desc:s.desc||''};
  return timed(encodeURIComponent(s.folder)+'/',6000).then(function(r){return r.ok?r.text():'';}).then(function(html){
    if(!html)return;
    var d=new DOMParser().parseFromString(html,'text/html');
    var t=d.querySelector('title');if(t&&t.textContent.trim())out.title=t.textContent.trim();
    var m=d.querySelector('meta[name="description"]');if(m&&m.getAttribute('content'))out.desc=m.getAttribute('content').trim();
  }).catch(function(){}).then(function(){return out;});
}
function build(){
  return timed('https://api.github.com/users/'+encodeURIComponent(USER)+'/repos?per_page=100&sort=pushed&direction=desc',8000)
    .then(function(r){if(!r.ok)throw new Error('api');return r.json();})
    .then(function(repos){
      var list=repos.filter(function(r){
        return r.has_pages&&!r.archived&&!r.disabled&&!r.private&&String(r.name).toLowerCase()!==HOME_REPO&&
          (!ONLY_TOPIC||(r.topics||[]).indexOf(ONLY_TOPIC)>=0);
      }).map(function(r){return {folder:r.name,desc:r.description||''};});
      EXTRA.forEach(function(e){list.push({folder:e.folder,desc:e.desc||''});});
      return Promise.all(list.map(enrich));
    });
}
function show(items,msg){
  var g=$('grid');
  $('status').textContent=msg||(items.length?(items.length===1?'موقع واحد':items.length+' مواقع'):'');
  if(!items.length){
    g.innerHTML='<div class="empty">لا توجد مواقع منشورة بعد. أنشئ مستودعاً عاماً، وفعّل فيه GitHub Pages، وستظهر هنا بطاقته تلقائياً.</div>';
    return;
  }
  g.innerHTML=items.map(function(s,i){
    var href=encodeURIComponent(s.folder)+'/';
    return '<a class="card" href="'+href+'"><img class="ico" src="'+href+'apple-touch-icon.png" alt="" width="60" height="60" loading="lazy" data-i="'+i+'">'+
      '<span class="ttl">'+esc(s.title)+'</span>'+(s.desc?'<span class="dsc">'+esc(s.desc)+'</span>':'')+'<span class="go">افتح الموقع</span></a>';
  }).join('');
  Array.prototype.forEach.call(g.querySelectorAll('img.ico'),function(img){
    img.addEventListener('error',function(){
      var s=items[+img.dataset.i],ph=document.createElement('span');
      ph.className='ico ph';ph.style.background=COLORS[+img.dataset.i%COLORS.length];
      ph.textContent=(s.title||'?').charAt(0);ph.setAttribute('aria-hidden','true');
      img.replaceWith(ph);
    },{once:true});
  });
}
function load(force){
  var c=readCache();
  if(c&&!force&&Date.now()-c.t<TTL){show(c.items);return;}
  if(c)show(c.items,'جارٍ تحديث القائمة...');else{$('grid').innerHTML='';$('status').textContent='جارٍ جلب المواقع...';}
  build().then(function(items){writeCache(items);show(items);}).catch(function(){
    if(c)show(c.items,'تعذّر التحديث الآن، وهذه آخر قائمة محفوظة.');
    else{$('grid').innerHTML='';$('status').textContent='تعذّر جلب قائمة المواقع من GitHub. حاول بعد قليل.';}
  });
}
$('btnRef').addEventListener('click',function(){load(true);});
load(false);
})();
</script>
</body>
</html>
