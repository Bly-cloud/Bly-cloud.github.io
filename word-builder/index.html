<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef4f2">
<meta name="robots" content="noindex">
<meta name="description" content="ألعاب عربية للأطفال من 6 إلى 8 سنوات: ركّب الكلمة، ورتّب الحروف، والحرف الناقص، والحرف الأول، واقرأ واختر الصورة، بالسحب والإفلات.">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<title>تركيب الكلمات</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600;700&display=swap">
<style>
/* Layout: calm classroom page; a picture card on top, letter slots below it, the letter tray at the bottom within thumb reach */
:root{
  color-scheme:light;
  --bg:#eef4f2; --card:#ffffff; --soft:#f5f8f7; --ink:#26364a; --muted:#64748a; --line:#d5e0dc;
  --sky:#6fa8d6; --sky-t:#e4f0f8; --mint:#5fb592; --mint-t:#e2f3eb; --sun:#f2c45a; --sun-t:#fbf1d6;
  --coral:#e08a78; --coral-t:#fbe8e3; --lav:#9b8fd0; --lav-t:#eeeaf8; --peach:#eea77c; --peach-t:#fcece2;
  --pic:#f4f8f7; --btn:#2f5d7c; --btn-fg:#ffffff; --focus:#2f5d7c;
  --shadow:0 2px 0 rgba(38,54,74,.06),0 8px 22px rgba(38,54,74,.07);
  --font:'Noto Naskh Arabic','Sakkal Majalla','Amiri',serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#141c26; --card:#1c2633; --soft:#18212c; --ink:#e6edf3; --muted:#9fb0c0; --line:#2c3a4a;
    --sky:#8cbde3; --sky-t:#1f3446; --mint:#7fcaa9; --mint-t:#1c3a30; --sun:#f2c45a; --sun-t:#3a3220;
    --coral:#ef9d8c; --coral-t:#3e2622; --lav:#b3a8e2; --lav-t:#2b2842; --peach:#f3b48a; --peach-t:#3d2c21;
    --pic:#eef3f2; --btn:#8cbde3; --btn-fg:#10202e; --focus:#f2c45a;
    --shadow:0 2px 0 rgba(0,0,0,.25),0 8px 22px rgba(0,0,0,.3); color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:20px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px;min-height:100vh}
button,input{font-family:inherit;font-size:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.app{max-width:760px;margin-inline:auto}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;font:700 28px/1.3 var(--font);margin:0}
.brand svg{flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--line);color:var(--ink);border-radius:999px;padding:4px 16px;font:600 17px/1.4 var(--font);min-height:44px}
.chip[aria-pressed="true"]{background:var(--btn);border-color:var(--btn);color:var(--btn-fg)}

h1.hello{font:700 clamp(30px,7vw,40px)/1.35 var(--font);margin:0 0 4px}
.lead{margin:0 0 18px;color:var(--muted)}
.panel{background:var(--card);border-radius:22px;padding:16px;box-shadow:var(--shadow);margin-bottom:18px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lbl{font-weight:700;color:var(--muted);min-width:5.5em}
.games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (min-width:640px){.games{grid-template-columns:repeat(3,minmax(0,1fr))}}
.game{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:start;padding:16px;border-radius:22px;border:0;background:var(--c-t);color:var(--ink);box-shadow:var(--shadow);min-width:0;min-height:150px}
.game .gi{width:52px;height:52px;border-radius:16px;background:var(--c);color:#fff;display:grid;place-items:center;font:700 26px/1 var(--font);margin-bottom:6px}
.game b{font:700 21px/1.35 var(--font)}
.game span{font-size:16px;color:var(--muted);line-height:1.6}
.g1{--c:var(--sky);--c-t:var(--sky-t)}.g2{--c:var(--mint);--c-t:var(--mint-t)}.g3{--c:var(--lav);--c-t:var(--lav-t)}
.g4{--c:var(--peach);--c-t:var(--peach-t)}.g5{--c:var(--coral);--c-t:var(--coral-t)}.g6{--c:var(--sun);--c-t:var(--sun-t)}
.g6 .gi{color:#3a2c08}
.foot{margin-top:18px;display:flex;justify-content:center}

.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.prog{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin:0 0 14px}
.seg{height:10px;border-radius:5px;background:var(--line)}
.seg.ok{background:var(--mint)}.seg.bad{background:var(--coral)}
.seg.cur{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--muted)}
.qcard{background:var(--card);border-radius:24px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:12px}
.instr{margin:0;font-weight:700;font-size:20px;text-align:center;color:var(--muted)}
.picwrap{display:flex;align-items:center;gap:14px}
.pic{width:170px;height:170px;border-radius:24px;background:var(--pic);padding:10px;display:grid;place-items:center}
.pic svg{width:100%;height:100%}
.pic.mystery{font:700 80px/1 var(--font);color:#9fb0c0}
.say{width:56px;height:56px;border-radius:50%;border:0;background:var(--sky-t);color:var(--btn);display:grid;place-items:center}
.slots{--sz:min(68px,calc((100vw - 64px - (var(--n) - 1) * 8px) / var(--n)));display:flex;gap:8px;justify-content:center;direction:rtl}
.slot{width:var(--sz);height:calc(var(--sz) * 1.15);border:3px dashed var(--sky);border-radius:16px;display:grid;place-items:stretch;background:var(--soft);transition:background .12s}
.slot.over{background:var(--sky-t);border-style:solid}
.slot.fixed{border:3px solid var(--line);background:var(--soft);place-items:center;font:700 calc(var(--sz) * .6)/1 var(--font)}
.slot.ok{border:3px solid var(--mint);background:var(--mint-t)}
.slot.bad{border:3px solid var(--coral);background:var(--coral-t);animation:shake .4s}
.slot .tile{width:100%;height:100%;box-shadow:none;border:0;background:transparent;font-size:calc(var(--sz) * .6)}
.preview{min-height:1.15em;font:700 clamp(40px,10vw,58px)/1.5 var(--font);color:var(--btn);text-align:center}
.preview .dim{color:var(--muted);opacity:.5}
.fb{min-height:1.6em;font:700 24px/1.5 var(--font);text-align:center}
.fb.ok{color:var(--mint)}.fb.no{color:var(--coral)}
.tray{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:84px;padding:12px;border-radius:22px;background:var(--card);box-shadow:var(--shadow);margin-top:14px}
.tray.over{outline:3px dashed var(--sky);outline-offset:-6px}
.tile{width:64px;height:72px;border-radius:16px;border:3px solid var(--sky);background:var(--card);color:var(--ink);display:grid;place-items:center;font:700 40px/1 var(--font);box-shadow:0 4px 0 var(--sky);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.tile.lift{opacity:.25}
.ghost{position:fixed;left:0;top:0;z-index:100;pointer-events:none;transform:scale(1.1) rotate(-4deg);box-shadow:0 12px 24px rgba(0,0,0,.25)}
.ctl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.btn{border-radius:999px;padding:8px 22px;font:700 19px/1.4 var(--font);border:2px solid var(--line);background:var(--card);color:var(--ink);min-height:48px}
.btn.pri{background:var(--btn);border-color:var(--btn);color:var(--btn-fg)}
.btn.big{font-size:22px;padding:10px 30px;min-height:56px}
.word{font:700 clamp(44px,12vw,64px)/1.5 var(--font);text-align:center;color:var(--btn)}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%;max-width:420px}
.choice{aspect-ratio:1;max-width:100%;border-radius:22px;border:3px solid var(--line);background:var(--pic);padding:12px}
.choice svg{width:100%;height:100%}
.choice.ok{border-color:var(--mint);box-shadow:0 0 0 4px var(--mint)}
.choice:disabled{opacity:.35;animation:shake .4s}

.res{background:var(--card);border-radius:24px;padding:24px 16px;text-align:center;box-shadow:var(--shadow)}
.res h2{margin:0;font:700 30px/1.4 var(--font)}
.stars{display:flex;justify-content:center;gap:10px;margin:12px 0}
.stars svg{width:64px;height:64px}
.son{fill:var(--sun);stroke:#c9962a;stroke-width:1.2;stroke-linejoin:round;animation:pop .5s both;animation-delay:calc(var(--i) * .18s)}
.soff{fill:none;stroke:var(--line);stroke-width:1.6;stroke-linejoin:round}
.rs{font:700 44px/1.2 var(--font)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:18px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:start}
th{color:var(--muted);font-weight:700}
.toast{position:fixed;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));margin-inline:auto;width:fit-content;max-width:calc(100% - 32px);background:var(--btn);color:var(--btn-fg);border-radius:999px;padding:8px 22px;font:700 18px/1.5 var(--font);opacity:0;pointer-events:none;transition:opacity .2s;z-index:120}
.toast.on{opacity:1}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
@media (max-width:420px){.pic{width:140px;height:140px}.tile{width:56px;height:64px;font-size:34px}.game{min-height:140px;padding:14px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  <main id="view"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

/* ---------- sound ---------- */
var AC=null;
function tone(f,t,d,v){var o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.14,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);}
function fx(k){
  if(!S.fx)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();var t=AC.currentTime;
    if(k==='ok'){tone(587,t,.14);tone(784,t+.12,.22);}else if(k==='no'){tone(262,t,.22,.1);}else if(k==='place'){tone(660,t,.06,.06);}
    else if(k==='win'){[523,659,784,1047].forEach(function(f,i){tone(f,t+i*.12,.24);});}}catch(e){}
}
var VOICE=null,voiceWarned=false;
function pickVoice(){try{var vs=speechSynthesis.getVoices()||[];VOICE=null;for(var i=0;i<vs.length;i++){if(/^ar/i.test(vs[i].lang)){VOICE=vs[i];if(/SA/i.test(vs[i].lang))break;}}}catch(e){}}
if('speechSynthesis' in window){pickVoice();try{speechSynthesis.addEventListener('voiceschanged',pickVoice);}catch(e){}}
function say(t){
  if(!('speechSynthesis' in window)){toast('النطق غير متاح في هذا المتصفح');return;}
  try{
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(t);u.lang=VOICE?VOICE.lang:'ar-SA';if(VOICE)u.voice=VOICE;u.rate=.75;speechSynthesis.speak(u);
    var vs=speechSynthesis.getVoices();if(!VOICE&&vs&&vs.length&&!voiceWarned){voiceWarned=true;toast('لا يتوفر صوت عربي في هذا الجهاز، فقد يكون النطق غير واضح');}
  }catch(e){}
}
function toast(t){var el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){el.classList.remove('on');},2200);}

/* ---------- puzzle generation ---------- */
function pool(){
  var p=WORDS.filter(function(w){return (S.level==='mix'||String(w[2])===S.level)&&(S.cat==='all'||w[3]===S.cat);});
  if(p.length<4)p=WORDS.filter(function(w){return S.cat==='all'||w[3]===S.cat;});
  if(p.length<4)p=WORDS.slice();
  return p;
}
function letters(w){return Array.from(w);}
function similarTo(ch,n,avoid){
  var out=[],grp='';SIMILAR.forEach(function(g){if(g.indexOf(ch)>=0)grp+=g;});
  shuffle(grp.split('')).forEach(function(c){if(c!==ch&&out.indexOf(c)<0&&avoid.indexOf(c)<0&&out.length<n)out.push(c);});
  shuffle(ALPH.slice()).forEach(function(c){if(c!==ch&&out.indexOf(c)<0&&avoid.indexOf(c)<0&&out.length<n)out.push(c);});
  return out;
}
function mkTiles(chars){return chars.map(function(c,i){return {id:i,ch:c};});}
function buildQ(type,w){
  var L=letters(w[0]),q={type:type,w:w,L:L,fixed:{},placed:[],done:false,wrong:false,bad:[],tries:0};
  if(type==='build'){
    var extra=similarTo(any(L),w[2]===1?2:3,L);
    q.tiles=mkTiles(shuffle(L.concat(extra)));q.open=L.map(function(_,i){return i;});
  }else if(type==='order'){
    var s;do{s=shuffle(L.slice());}while(L.length>1&&s.join('')===L.join(''));
    q.tiles=mkTiles(s);q.open=L.map(function(_,i){return i;});
  }else if(type==='missing'){
    var k=rnd(0,L.length-1);L.forEach(function(c,i){if(i!==k)q.fixed[i]=c;});
    q.tiles=mkTiles(shuffle([L[k]].concat(similarTo(L[k],3,[L[k]]))));q.open=[k];
  }else if(type==='first'){
    var others=shuffle(ALPH.filter(function(c){return c!==L[0]&&c!=='ا';})).slice(0,3);
    q.tiles=mkTiles(shuffle([L[0]].concat(others)));q.open=[0];q.firstOnly=true;
  }else{
    var opts=[w].concat(shuffle(WORDS.filter(function(x){return x[0]!==w[0];})).slice(0,3));
    q.choices=shuffle(opts);
  }
  q.open&&q.open.forEach(function(i){q.placed[i]=null;});
  return q;
}
function startRound(type){
  var p=shuffle(pool().slice()),list=[];
  while(list.length<TOTAL){p.forEach(function(w){if(list.length<TOTAL&&(!list.length||list[list.length-1][0]!==w[0]))list.push(w);});p=shuffle(p);}
  var types=['build','order','missing','first','read'];
  R={type:type,qs:list.map(function(w,i){return buildQ(type==='mix'?types[i%5]:type,w);}),i:0,score:0,res:[],fb:'',fbc:''};
  if(type==='mix')shuffle(R.qs);
  view='game';render();
}

/* ---------- rendering ---------- */
function tw(w){return S.tashkeel?w[1]:w[0];}
function gameName(t){for(var i=0;i<GAMES.length;i++)if(GAMES[i][0]===t)return GAMES[i][1];return '';}
function homeHTML(){
  var h='<h1 class="hello">هيا نركّب الكلمات</h1><p class="lead">اختر المستوى والمجموعة، ثم اختر لعبة. في كل جولة عشر كلمات.</p>';
  h+='<section class="panel"><div class="row"><span class="lbl">المستوى</span>'+LEVELS.map(function(l){return '<button class="chip" type="button" data-level="'+l[0]+'" aria-pressed="'+(S.level===l[0])+'">'+l[1]+'</button>';}).join('')+'</div>'+
    '<div class="row"><span class="lbl">المجموعة</span>'+CATS.map(function(c){return '<button class="chip" type="button" data-cat="'+c[0]+'" aria-pressed="'+(S.cat===c[0])+'">'+c[1]+'</button>';}).join('')+'</div>'+
    '<div class="row"><span class="lbl">خيارات</span><button class="chip" type="button" data-opt="tashkeel" aria-pressed="'+S.tashkeel+'">التشكيل</button><button class="chip" type="button" data-opt="fx" aria-pressed="'+S.fx+'">أصوات اللعب</button><button class="chip" type="button" data-opt="names" aria-pressed="'+S.names+'">نطق أسماء الحروف</button></div></section>';
  h+='<div class="games">'+GAMES.map(function(g){return '<button class="game '+g[3]+'" type="button" data-game="'+g[0]+'"><span class="gi" aria-hidden="true">'+g[4]+'</span><b>'+g[1]+'</b><span>'+g[2]+'</span></button>';}).join('')+'</div>';
  h+='<div class="foot"><button class="chip" type="button" data-act="parents">صفحة الوالدين</button></div>';
  return h;
}
function cur(){return R.qs[R.i];}
function prevText(q){
  if(q.done)return tw(q.w);
  if(q.type!=='build'&&q.type!=='order')return '';
  var s='';for(var i=0;i<q.L.length;i++){var t=q.placed[i];if(t==null)break;s+=q.tiles[t].ch;}
  if(!s)return '';
  if(s.length<q.L.length&&NONJOIN.indexOf(s[s.length-1])<0)s+='ـ';
  return s;
}
function slotsHTML(q){
  var h='<div class="slots" style="--n:'+(q.firstOnly?Math.max(3,q.L.length):q.L.length)+'" id="slots">';
  var n=q.firstOnly?1:q.L.length;
  for(var i=0;i<n;i++){
    if(q.fixed[i]!=null){h+='<span class="slot fixed" aria-label="'+q.fixed[i]+'">'+q.fixed[i]+'</span>';continue;}
    var t=q.placed[i],cls='slot'+(q.done?' ok':'')+(q.bad.indexOf(i)>=0?' bad':'');
    h+='<span class="'+cls+'" data-slot="'+i+'">'+(t!=null?tileHTML(q.tiles[t]):'')+'</span>';
  }
  return h+'</div>';
}
function tileHTML(t){return '<span class="tile" role="button" tabindex="0" data-id="'+t.id+'" aria-label="الحرف '+(NAMES[t.ch]||t.ch)+'">'+t.ch+'</span>';}
var SAYICON='<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>';
function gameHTML(){
  var q=cur(),h='',instr;
  var pr='';for(var i=0;i<TOTAL;i++)pr+='<i class="seg'+(R.res[i]?' '+R.res[i]:'')+(i===R.i?' cur':'')+'"></i>';
  h+='<div class="bar"><b>'+gameName(q.type)+'</b><span class="chip" aria-label="النتيجة">النجوم: '+R.score+'</span></div><div class="prog" aria-hidden="true">'+pr+'</div>';
  h+='<section class="qcard">';
  if(q.type==='read'){
    h+='<p class="instr">اقرأ الكلمة، ثم اضغط على صورتها</p><div class="picwrap"><div class="word">'+tw(q.w)+'</div><button class="say" type="button" data-act="say" aria-label="اسمع الكلمة">'+SAYICON+'</button></div>'+
      '<div class="choices">'+q.choices.map(function(c){return '<button class="choice'+(q.done&&c[0]===q.w[0]?' ok':'')+'" type="button" data-choice="'+c[0]+'" aria-label="'+c[0]+'"'+(q.bad.indexOf(c[0])>=0?' disabled':'')+'>'+pic(c[0])+'</button>';}).join('')+'</div>';
  }else{
    instr=q.type==='build'?'اسحب الحروف إلى المربعات لتكتب اسم الصورة':q.type==='order'?'رتّب الحروف لتكوّن كلمة':q.type==='missing'?'ما الحرف الناقص؟':'بأي حرف تبدأ هذه الكلمة؟';
    var showPic=q.type!=='order'||q.done;
    h+='<p class="instr">'+instr+'</p><div class="picwrap"><div class="pic'+(showPic?'':' mystery')+'">'+(showPic?pic(q.w[0]):'؟')+'</div><button class="say" type="button" data-act="say" aria-label="اسمع الكلمة">'+SAYICON+'</button></div>'+
      slotsHTML(q)+'<div class="preview" aria-live="polite">'+prevText(q)+'</div>';
  }
  h+='<div class="fb '+R.fbc+'" role="status">'+R.fb+'</div></section>';
  if(q.type!=='read'){
    var inSlot={};q.placed.forEach(function(t){if(t!=null)inSlot[t]=1;});
    h+='<div class="tray" id="tray" aria-label="الحروف">'+q.tiles.filter(function(t){return !inSlot[t.id];}).map(tileHTML).join('')+'</div>';
  }
  h+='<div class="ctl">'+(q.done?'<button class="btn pri big" type="button" data-act="next">'+(R.i<TOTAL-1?'الكلمة التالية':'النتيجة')+'</button>':'<button class="btn" type="button" data-act="hint">ساعدني</button>')+'</div>';
  return h;
}
function resultHTML(){
  var st=R.score>=9?3:R.score>=6?2:R.score>=3?1:0,s='',P='<path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.6l1.3-6.6L2.5 9.4l6.6-.8z"/>';
  for(var i=0;i<3;i++)s+='<svg viewBox="0 0 24 24" style="--i:'+i+'" class="'+(i<st?'son':'soff')+'">'+P+'</svg>';
  var m=R.score===10?'كل الكلمات صحيحة من أول مرة!':R.score>=7?'أحسنت، قراءتك ممتازة.':R.score>=4?'جيد، ومع التدريب تصبح أسرع.':'لا بأس، العب مرة أخرى وستتحسن.';
  return '<section class="res"><h2>انتهت الجولة</h2><div class="stars" aria-hidden="true">'+s+'</div><div class="rs">'+R.score+' من '+TOTAL+'</div><p>'+m+'</p>'+
    '<div class="ctl"><button class="btn pri big" type="button" data-act="again">العب مرة أخرى</button><button class="btn big" type="button" data-act="home">القائمة</button></div></section>';
}
function parentsHTML(){
  var rows=Object.keys(S.stats).map(function(k){var x=S.stats[k];return [k,x.t||0,x.e||0,x.h||0];}).filter(function(r){return r[1]>0;});
  rows.sort(function(a,b){return (b[2]+b[3])/b[1]-(a[2]+a[3])/a[1]||b[2]-a[2];});
  var total=rows.reduce(function(s,r){return s+r[1];},0);
  var h='<h1 class="hello">صفحة الوالدين</h1><p class="lead">هنا الكلمات التي تعثّر فيها طفلك أكثر من غيرها، لتعيدا التدريب عليها معاً. البيانات محفوظة على هذا الجهاز فقط.</p>';
  h+='<section class="panel"><div class="row"><span class="lbl">الجولات</span><b>'+S.rounds+'</b></div><div class="row"><span class="lbl">الكلمات المحلولة</span><b>'+total+'</b></div></section>';
  if(!rows.length)h+='<section class="panel"><p style="margin:0">لا توجد بيانات بعد. ستظهر هنا بعد أول جولة.</p></section>';
  else h+='<section class="panel"><div class="tw"><table><thead><tr><th>الكلمة</th><th>مرات الظهور</th><th>أخطاء</th><th>طلب المساعدة</th></tr></thead><tbody>'+
    rows.slice(0,20).map(function(r){return '<tr><td><b>'+esc(r[0])+'</b></td><td>'+r[1]+'</td><td>'+r[2]+'</td><td>'+r[3]+'</td></tr>';}).join('')+'</tbody></table></div></section>';
  h+='<div class="ctl"><button class="btn" type="button" data-act="reset">'+(resetArm?'اضغط مرة أخرى لمسح البيانات':'مسح البيانات')+'</button><button class="btn pri" type="button" data-act="home">القائمة</button></div>';
  return h;
}
function render(){
  $('btnBack').hidden=view==='home';
  var v=$('view');
  if(view==='home')v.innerHTML=homeHTML();
  else if(view==='game')v.innerHTML=gameHTML();
  else if(view==='result')v.innerHTML=resultHTML();
  else v.innerHTML=parentsHTML();
}

/* ---------- game logic ---------- */
function stat(w,k){var s=S.stats[w]||(S.stats[w]={t:0,e:0,h:0});s[k]=(s[k]||0)+1;}
function finishQ(q){
  q.done=true;
  stat(q.w[0],'t');if(q.wrong)stat(q.w[0],'e');if(q.hinted)stat(q.w[0],'h');
  var first=!q.wrong&&!q.hinted;
  R.res[R.i]=first?'ok':'bad';if(first)R.score++;
  R.fb=first?any(MSG_OK):'صحيح! الكلمة: '+q.w[0];R.fbc='ok';
  save();fx('ok');render();
  setTimeout(function(){say(q.w[1]);},250);
  var nb=document.querySelector('[data-act="next"]');if(nb)try{nb.focus({preventScroll:true});}catch(e){}
}
function check(){
  var q=cur(),open=q.firstOnly?[0]:q.open;
  if(open.some(function(i){return q.placed[i]==null;}))return;
  var bad=open.filter(function(i){return q.tiles[q.placed[i]].ch!==q.L[i];});
  if(!bad.length){finishQ(q);return;}
  q.wrong=true;q.bad=bad;R.fb=any(MSG_NO);R.fbc='no';fx('no');render();
  setTimeout(function(){if(cur()!==q)return;bad.forEach(function(i){q.placed[i]=null;});q.bad=[];render();},900);
}
function put(id,slot){
  var q=cur();if(q.done||q.bad.length)return;
  var prev=q.placed.indexOf(id),occ=q.placed[slot];
  if(prev===slot)return;
  if(prev>=0)q.placed[prev]=occ!==undefined?occ:null;
  q.placed[slot]=id;R.fb='';R.fbc='';
  fx('place');if(S.names)say(NAMES[q.tiles[id].ch]||q.tiles[id].ch);
  render();check();
}
function toTray(id){var q=cur();if(q.done||q.bad.length)return;var i=q.placed.indexOf(id);if(i>=0){q.placed[i]=null;render();}}
function tapTile(id){
  var q=cur();if(q.done||q.bad.length)return;
  if(q.placed.indexOf(id)>=0){toTray(id);return;}
  var open=q.firstOnly?[0]:q.open;
  for(var k=0;k<open.length;k++)if(q.placed[open[k]]==null){put(id,open[k]);return;}
}
function hint(){
  var q=cur();if(q.done)return;q.hinted=true;
  if(q.type==='read'){var wrong=q.choices.filter(function(c){return c[0]!==q.w[0]&&q.bad.indexOf(c[0])<0;});if(wrong.length>1){q.bad.push(wrong[0][0]);R.fb='أزلت لك صورة خاطئة.';R.fbc='';render();}return;}
  var open=q.firstOnly?[0]:q.open;
  for(var k=0;k<open.length;k++){
    var i=open[k],t=q.placed[i];
    if(t==null||q.tiles[t].ch!==q.L[i]){
      var inSlot={};q.placed.forEach(function(x,j){if(x!=null&&q.tiles[x].ch===q.L[j])inSlot[x]=1;});
      var cand=q.tiles.filter(function(x){return x.ch===q.L[i]&&!inSlot[x.id];})[0];
      if(!cand)return;
      var from=q.placed.indexOf(cand.id);if(from>=0)q.placed[from]=null;
      q.placed[i]=cand.id;R.fb='وضعت لك حرفاً.';R.fbc='';render();check();return;
    }
  }
}
function choose(word){
  var q=cur();if(q.done||q.bad.indexOf(word)>=0)return;
  if(word===q.w[0]){finishQ(q);return;}
  q.wrong=true;q.bad.push(word);R.fb=any(MSG_NO);R.fbc='no';fx('no');render();
}
function next(){
  if(R.i<TOTAL-1){R.i++;R.fb='';R.fbc='';render();try{window.scrollTo(0,0);}catch(e){}}
  else{S.rounds++;save();view='result';render();var st=R.score>=6;fx(st?'win':'ok');}
}

/* ---------- drag and drop (touch, mouse, pen) ---------- */
function clearOver(){Array.prototype.forEach.call(document.querySelectorAll('.over'),function(e){e.classList.remove('over');});}
function targetAt(x,y){var el=document.elementFromPoint(x,y);if(!el)return null;return el.closest('.slot:not(.fixed)')||el.closest('.tray');}
document.addEventListener('pointerdown',function(e){
  if(view!=='game')return;var t=e.target.closest?e.target.closest('.tile'):null;if(!t)return;
  var q=cur();if(q.done||q.bad.length)return;
  if(e.pointerType==='mouse'&&e.button!==0)return;
  e.preventDefault();var r=t.getBoundingClientRect();
  D={id:+t.dataset.id,el:t,sx:e.clientX,sy:e.clientY,ox:e.clientX-r.left,oy:e.clientY-r.top,w:r.width,h:r.height,moved:false,g:null,pid:e.pointerId,fs:getComputedStyle(t).fontSize};
});
document.addEventListener('pointermove',function(e){
  if(!D||e.pointerId!==D.pid)return;
  if(!D.moved){if(Math.hypot(e.clientX-D.sx,e.clientY-D.sy)<7)return;D.moved=true;
    var g=D.el.cloneNode(true);g.className='tile ghost';g.removeAttribute('tabindex');g.style.width=D.w+'px';g.style.height=D.h+'px';g.style.fontSize=D.fs;
    document.body.appendChild(g);D.g=g;D.el.classList.add('lift');}
  D.g.style.left=(e.clientX-D.ox)+'px';D.g.style.top=(e.clientY-D.oy)+'px';
  clearOver();var tg=targetAt(e.clientX,e.clientY);if(tg)tg.classList.add('over');
  e.preventDefault();
},{passive:false});
function endDrag(){var d=D;D=null;clearOver();if(d){if(d.g)d.g.remove();d.el.classList.remove('lift');}return d;}
document.addEventListener('pointerup',function(e){
  if(!D||e.pointerId!==D.pid)return;var d=endDrag();
  if(!d.moved){tapTile(d.id);return;}
  var tg=targetAt(e.clientX,e.clientY);
  if(tg&&tg.dataset.slot!=null)put(d.id,+tg.dataset.slot);else if(tg)toTray(d.id);
});
document.addEventListener('pointercancel',function(e){if(D&&e.pointerId===D.pid)endDrag();});
document.addEventListener('keydown',function(e){
  var t=e.target;if(view==='game'&&t.classList&&t.classList.contains('tile')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();tapTile(+t.dataset.id);}
});

/* ---------- clicks ---------- */
$('view').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  if(b.dataset.level){S.level=b.dataset.level;save();render();return;}
  if(b.dataset.cat){S.cat=b.dataset.cat;save();render();return;}
  if(b.dataset.opt){S[b.dataset.opt]=!S[b.dataset.opt];save();render();return;}
  if(b.dataset.game){startRound(b.dataset.game);return;}
  if(b.dataset.choice){choose(b.dataset.choice);return;}
  var a=b.dataset.act;
  if(a==='say')say(cur().w[1]);
  else if(a==='hint')hint();
  else if(a==='next')next();
  else if(a==='again')startRound(R.type);
  else if(a==='home'){view='home';resetArm=false;render();}
  else if(a==='parents'){view='parents';resetArm=false;render();}
  else if(a==='reset'){if(resetArm){S.stats={};S.rounds=0;save();resetArm=false;toast('تم مسح البيانات');}else resetArm=true;render();}
});
$('btnBack').addEventListener('click',function(){view='home';render();});

load();render();
})();
</script>
</body>
